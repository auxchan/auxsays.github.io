  "text": "Synthetic test post.\n\nSince mid October the first boot of each day ends in a BSOD. It happens with the 26H2 enablement package (KB5121794) and not on 25H2. What I have ruled out is below.\n\nSETUP\n  Generic 15-inch laptop, 12th-gen CPU, 16 GB RAM, NVMe SSD (fixture values)\n  Win11 Home 25H2 26200.9711 (current). Issue on 26H2 / KB5121794.\n  Dual boot with a Linux distribution, UEFI, Secure Boot on\n\nTIMELINE\n  16 Oct  26H2 plus a game -> 0x13A KERNEL_MODE_HEAP_CORRUPTION, repeatable. Removing KB5121794 fixed it\n  18 Oct  cold boot on 25H2 -> 0xc0000218, stuck at 0%. Second boot fine. chkdsk, sfc and DISM clean\n  21 Oct  cold boot -> 0x74 BAD_SYSTEM_CONFIG_INFO. Second boot fine. Firmware reflashed from USB\n  22-29 Oct  25H2 with the new firmware: clean cold boots every day\n  29 Oct  Windows Update put KB5121794 back\n  30 Oct  cold boot on 26H2 -> 0x7A KERNEL_DATA_INPAGE_ERROR, then Automatic Repair failed. Removed KB5121794 again, back on 25H2\n\nNOTES\n  - only the first boot after hours powered off; warm restarts never crash\n  - every code points at disk or registry reads failing during boot\n  - no storage errors in the System log"

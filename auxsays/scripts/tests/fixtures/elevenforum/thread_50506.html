  "text": "Since mid-October my first power-on of the day ends in a BSOD whenever the 26H2 enablement package (KB5121794) is present; on 25H2 it never happens. What I have eliminated so far:\n\nMACHINE\n  15-inch laptop, 12th-gen CPU, 16 GB RAM, NVMe SSD (placeholder values)\n  Running now: 25H2 26200.9711 (current), Home edition. Issue on 26H2 only, with KB5121794.\n  Linux installed alongside, UEFI, Secure Boot on\n\nLOG\n  16 Oct  26H2 while gaming: 0x13A KERNEL_MODE_HEAP_CORRUPTION every time. Uninstalling KB5121794 fixed it\n  18 Oct  first power-on, 25H2: 0xc0000218, frozen at 0%. A restart worked. chkdsk/sfc/DISM all clean\n  21 Oct  first power-on: 0x74 BAD_SYSTEM_CONFIG_INFO. A restart worked. Firmware re-flashed from a USB stick\n  22-29 Oct  25H2 with the reflashed firmware: no crash on any morning\n  29 Oct  KB5121794 came back through Windows Update\n  30 Oct  first power-on, 26H2: 0x7A KERNEL_DATA_INPAGE_ERROR, after which Automatic Repair gave up. The next attempt started; I removed KB5121794 again and I'm on 25H2\n\nOBSERVATIONS\n  - it happens only once the laptop has been off for hours; warm restarts are fine\n  - each code means a disk or registry read went wrong during startup\n  - the System log shows no storage errors"

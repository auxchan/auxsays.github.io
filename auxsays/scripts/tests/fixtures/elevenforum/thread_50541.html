  "text": "Under 25h2 all works well.  When the preview patch or 26h2 went into service, my taskbar randomly becomes unresponsive and the File and Edit tabs also.  I reverted from 26h2 to 25h2 and everything was fine.  the preview 5127935 went in and corrupted things, so I took it out and paused updates for the 5 weeks ahead.  I have had extensive chats with Microsoft and there is no admission of a problem and yet Microsoft states the an explorer reset will fix it.  So they know about the freezing.  That by the way does not  work.  One must log out and in or reboot to temporarily reboot.\n\nNow, my machine, bought in 2022 was actually made in 2018.  The pandemic shortened the supply at Staples.  I have an HP 590 machine, with a generation 8 processor that is supported by windows 11.  It was intended for windows 10 and in the end has worked well with win 11.  Drivers though are 2018.  But these problems seem to be one of two things... a change in architecture that end life of my machine or an update with bad code that reflects what is also in an in-place system overwrite.  I am told to do it and then by other tech to wait.. So I am in limbo.  I don't think that it is my machine sfc and dism report no problems and it IS kb5127936 to causes this, that is 100% proven."

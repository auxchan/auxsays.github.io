# OFFICIAL UPDATE LIFECYCLE: ONE VERIFIED EXCEPTION, NOT THE LIFECYCLE MECHANISM (GROWTH-3).
#
# This file holds exactly one record: Microsoft withdrew KB5079391 for new installations and named
# KB5086672 as its replacement. The owner approved showing "AVOID - Microsoft withdrew this update
# for new installations. Replacement: KB5086672" on its pages (decision 2, 2026-11-06). It applies
# to INSTALLING the withdrawn update, not to devices that already installed it.
#
# It is NOT how lifecycle facts will be maintained. The general "newer update available" links (74
# Windows pages) are not built: they wait for the Microsoft KB source assessment (rights and
# production reachability), exact KB/build applicability checks and a deterministic
# source-to-record writer. lib/verdict_reasons.lifecycle_errors refuses a second entry here, so this file
# cannot grow into a hand-maintained list.
#
# Stored: KB ids, the exact OS builds, dates, the official article URL and the relationship type.
# No Microsoft text. Verified 2026-11-06 from the article's own withdrawal note (GROWTH-3 spec v1
# KB read, template `withdrawn_replaced_by`).
#
# PROVENANCE (G66), so the record of what supported this decision lives here and not only in a
# local copy of the page outside the repository. official_url is the article's own rel=canonical URL. source_retrieved_at is when that
# copy was fetched (UTC), source_sha256 the sha256 of the retrieved HTML file, and statement_sha256 the
# sha256 of the withdrawal statement matched in it: the visible article text (script and style blocks
# removed, tags replaced by spaces, HTML entities unescaped, whitespace, zero-width spaces and en/em
# dashes collapsed to one space), from "This update is no longer being offered" through the end of
# that sentence and on into the next one, ending at the end of the first KB id in it ("KB5086672"; the
# rest of that sentence is not part of the span; 169 characters for this entry), whitespace-collapsed
# and stripped, UTF-8. Recorded in the G65 K3 manifest
# and re-computed from the same local file for G66; the page itself is not stored anywhere in the
# repository. A hash shows WHICH text supported this decision; it does not by itself show the decision
# is right. Re-reading the article needs the K1 terms decision first: no support.microsoft.com fetch.

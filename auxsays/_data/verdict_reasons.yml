      statement: Fixed a crash on macOS 27.2 when starting OBS Studio
    transition:
      working: "32.1.2"
      failing: "32.2.2"
    material: OBS does not start at all on the affected system.
    new_in_this_version: true
    fixed_in: "33.0.0"
    reviewed_at: "2026-11-06"
    basis: GROWTH-3 spec v3 section 7 (OBS 32.2.2 calibration)


# REVIEWED VERDICT REASONS (GROWTH-3). The only way a patch page can say TEST FIRST or WAIT.
#
# Read by lib/patch_decision.decide (through lib/verdict_reasons). The page does not read this file:
# build_verdict_projection.py writes decide's answer to _data/verdict_projection.yml at deploy and
# _includes/patch-verdict-gate.html prints that, so only Python judges an entry. Written ONLY by a
# reviewed pull request: never by a collector, a lane or a phrase rule.
#
# Each entry names the exact page (product_id, update_version, target_build), the verdict and its
# scope ("WAIT if ..."), the reason class, a one-line public reason in AUXSAYS's own words, and the
# COUNTED evidence rows it rests on (id + source_url). It supports a verdict only while:
#   - every cited row is still counted on that page (an audited withdrawal makes the entry
#     unsupported: at the next deploy the page falls back -- to INSUFFICIENT DATA, or to another
#     supported entry -- and QA warns, naming what the page renders);
#   - at least two distinct reporters are cited, or an official confirmation is named and found
#     verbatim in that record's captured official notes;
#   - a WAIT is a regression: the version transition, a written material impact, and new in this
#     version (a persistent problem is never called new).
#
# Counts, sentiment and theme-derived severity never decide a verdict. A new TEST FIRST or WAIT
# currently needs a new reviewed entry here; a deterministic corroboration signal is follow-up work.
#
# Seeded 2026-11-10 from the GROWTH-3 spec v3 calibration (sections 7 and 9), kept only where the
# counted rows on the page support it today.

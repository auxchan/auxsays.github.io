# Reviewed coverage debt (AUX-102). HAND-MAINTAINED, changed only by a reviewed pull request.
#
# One entry per Core catalog product that AUXSAYS does not monitor today: the gap is stated, owned and
# given a next step instead of hiding behind a catalog entry. The daily coverage assessment
# (scripts/assess_coverage.py, run by pages.yml) prints these for the owner, and the deploy check
# (scripts/ci/verify_coverage_claims.py) refuses a NEW Core product whose official lane is switched off
# and that has no entry here. Existing gaps never block a deploy; they are listed.
#
# Fields:
#   product_id            a catalog product (patch_products.yml)
#   remediation_priority  P1 | P2 | P3
#   blocking_reason       vendor_terms_unresolved | source_blocks_automation | adapter_not_built |
#                         no_machine_readable_source
#   next_action           the next engineering step, in plain words
#   plan                  planned | not_planned. `planned` makes the public label read "Monitoring planned;
#                         not active" while the lane stays off. It never makes anything read as monitored.
#   review_by             date by which the entry is reviewed again; the assessment flags it after that
#   ledger                the engineering ledger entry that owns the gap
#   observed_official_releases (optional)
#                         official releases a person verified on the vendor's own pages. The assessment
#                         reports any that the patch store does not hold. Reading a page is not collection.
#
# Dates are QUOTED strings: offline render harnesses serialise every _data file to JSON, and an unquoted
# YAML date becomes a value json.dumps refuses (test_patch_decision_hierarchy failed on it).

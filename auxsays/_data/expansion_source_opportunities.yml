  # ---------------------------------------------------------------------------------------
  # B. ZENDESK COMMUNITY POSTS -- the same host family PR #52 already adapts for official
  # ingestion. This is the single cheapest way to give the four Elgato products a consensus
  # lane, because they currently have NONE and produce zero records.

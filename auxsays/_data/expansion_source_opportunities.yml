  # ---------------------------------------------------------------------------------------
  # C. GITHUB -- the only consensus method in this repo with an unbroken success record
  # (obs-studio github_issues). Extending it to GitHub-hosted products is config, not code.
  # ---------------------------------------------------------------------------------------

  - opportunity_id: comfyui-github-issues
    product_ids: [comfyui]
    source_name: ComfyUI GitHub Issues
    source_type: github_issues
    lane: consensus
    official_or_community: community
    domain: api.github.com
    entry_point: https://api.github.com/repos/comfyanonymous/ComfyUI/issues
    discovery_method: github_issues
    auth_requirement: optional_token_for_rate_limit
    proof_level: structure_proven
    measured_at: 2026-08-13
    measurement: >-
      HTTP 200 in 602 ms, 39 KB for 3 issues; full issue objects (body, created_at, closed_at,
      author_association, comments). Identical method to obs-studio's `github_issues`, the only
      consensus method in `evidence_method_health.yml` with a clean success record.
    patch_specificity: expected_good
    expected_supply: high
    reuse_scope: [comfyui]
    shared_framework: github_issues
    status: production_candidate
    blocking_unknowns:
      - ComfyUI releases are frequent and versions are tag-like; confirm issue bodies name them.
      - 'PR #49 must be in main first -- any lane whose transport touches `lib.http` inherits the credential-egress defect until the exact-origin gate lands.'
    next_experiment: >-
      Register `github_issues` for comfyui in `collector_ownership.ALLOWED_METHODS`, then dry-run
      one release window and count accepted rows under the unchanged acceptance gates.
    notes: >-
      comfyui already has 35 official_only records from the proven `github_releases` adapter and
      zero consensus rows. Same vendor, same platform, already-successful method: the lowest-risk
      consensus lane available anywhere in the inventory.


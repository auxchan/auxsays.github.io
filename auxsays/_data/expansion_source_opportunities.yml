schema_version: 1
# AUXSAYS source-expansion backlog: additional evidence sources for CONFIGURED products.
#
# TERMINOLOGY (used consistently; 47 configured products is NOT 47 actively tracked products):
#   configured products                     -- present in patch_products.yml (47)
#   enabled-ingestion products              -- an ingestion source with enabled: true (16)
#   products with generated records         -- at least one record under updates/generated (11)
#   products with registered consensus      -- listed in collector_ownership.ALLOWED_METHODS (7)
#   products with consensus evidence        -- at least one row in consensus_evidence.yml (6)
#
# WHY THIS FILE LIVES IN _data (measured, not assumed): `auxsays/_config.yml` has no `exclude:`
# list, so Jekyll copies `auxsays/scripts/**` into the built site -- every collector, adapter and
# test fixture is currently fetchable at https://auxsays.com/scripts/... (verified 2026-08-13:
# /scripts/lib/http.py -> 200). Underscore-prefixed data directories are NOT copied
# (/_data/patch_products.yml -> 404), and every template reference is key-specific
# (`site.data.<key>`) with no generic iteration, so adding keys here renders nothing. `_data` is
# therefore the LESS exposed location, which is the opposite of the usual assumption.
#
# This file is planning/backlog data. It is never read by the pipeline, never a source of
# evidence, and must never be confused with `patch_ingestion_sources.yml` (production config).
#
# DOCTRINE. Discovery-method quality never weakens acceptance. Wherever a report is found, it
# counts only if `base.apply_acceptance_gates` is satisfied: exact product, exact patch/version,
# report date on/after release where known, specific report URL, concrete user-facing issue --
# official notes, announcements, generic discussion, search-result pages, pre-release complaints
# and duplicates never count. Different discovery methods, same acceptance rules.
#
# Method CLASSES (transport, bounds, health semantics) are documented separately in
# `auxsays/scripts/README-discovery-methods.md` (PR #53). This file is the per-product backlog:
# which concrete source serves which product, what has actually been measured, and what the next
# experiment is. Keep the two in sync rather than duplicating method-class detail here.

# Deterministic lifecycle. Every opportunity carries exactly one.
lifecycle_states:
  discovered: Named and classified; nothing measured yet.
  needs_probe: Requires a transport/structure measurement before it can be judged.
  transport_proven: Endpoint answers and its structure is understood; acceptance not yet tested.
  acceptance_probe_needed: Transport proven; must still prove patch-specific rows survive gating.
  viable: Transport + patch specificity + supply all measured adequate; not yet implemented.
  blocked: Measured refusal (challenge page, 403/429, empty body) -- fail closed, not silent.
  broken: Previously worked, now fails structurally (parser or endpoint contract changed).
  low_supply: Reachable and parseable but too few patch-specific rows to justify a lane.
  low_confidence: Reachable but identity/version attribution is unreliable.
  rejected: Deliberately not pursued; `notes` records why.
  needs_policy_decision: >-
    Measured enough to describe, but proceeding is a policy/economics call (cost, key
    management, vendor dependency) rather than a further measurement.
  production_candidate: Viable and scheduled for implementation.
  implemented: Shipped as a registered method in `collector_ownership.ALLOWED_METHODS`.

# INDEPENDENT PROOF DIMENSIONS -- not an ascending ladder.
#
# A single `proof_level` field was logically wrong: these facts are independent and are routinely
# measured in incompatible combinations. helpx.adobe.com answers locally and times out on every
# Actions User-Agent class (run 31530112187, 12/12, zero body bytes), so local reachability cannot
# imply Actions reachability. forum.blackmagicdesign.com answers HTTP 202 with a zero-byte
# challenge body, so `local_reachable: proven` coexists with `structure_proven: failed`. Every
# opportunity therefore records each dimension separately, and "not measured" is never dressed up
# as an intermediate rung.
proof_dimensions:
  local_reachable: The endpoint answered from a developer machine.
  actions_reachable: The endpoint answered from a GitHub Actions runner.
  structure_proven: The response shape was parsed and the fields a lane needs were located.
  patch_specificity_proven: Rows can be tied to an EXACT patch version for THIS product.
  supply_proven: Enough qualifying rows exist per release to be worth collecting.
  production_proven: A scheduled run produced accepted evidence for THIS product.

proof_values:
  proven: Measured and satisfied.
  failed: Measured and NOT satisfied (a refusal, a missing contract, a dead credential).
  unknown: Not measured. Never treat as a soft pass.
  not_applicable: The dimension cannot apply to this source class.

# `production_proven: proven` is the only derived-constrained value: it requires
# actions_reachable, structure_proven, patch_specificity_proven and supply_proven to be proven,
# because that combination is what "a scheduled run produced accepted evidence" means.
#
# NO BORROWED CREDIBILITY. `transport_precedent` records that the same transport works for a
# DIFFERENT product. It is free text, never a proof value, and can never satisfy a proof gate:
# "github_issues works for OBS" supports reuse confidence for a ComfyUI lane, it does not make
# that lane production-proven.

# MEASUREMENT FRESHNESS. `last_checked` + `recheck_after_days` let the validator distinguish a
# current measurement from a stale one from one that never happened. Stale proof is surfaced and
# cannot support ready_to_build; an opportunity that has measured nothing carries no last_checked
# and reads as never_measured. No scheduler is required for this to be useful -- the validator
# computes the state on every run.

# PAID / KEYED DEPENDENCIES ARE NOT CATEGORICALLY FORBIDDEN. The doctrine bars production
# evidence collection from depending on Taylor or on an AI subscription; it does not bar a
# conventional deterministic paid API. Such a source is evaluated on cost, key management, rate
# limits, reliability, ToS, vendor lock-in, single-source risk, and whether a deterministic
# direct source is simply better -- see `paid_api_evaluation` on any opportunity that needs one.

# SHARED FRAMEWORKS. Declared so that an opportunity cannot silently borrow a framework bound to
# the other evidence lane. The Zendesk case is the reason this exists: Help Center ARTICLES and
# COMMUNITY POSTS are different endpoint families with different response contracts, different
# lanes and different acceptance semantics, even though they share a vendor, a host and probably
# a lower-level request/pagination client.
shared_frameworks:
  adobe_community_algolia:
    lane: consensus
    contract: searchToken -> keyless Algolia query -> getTopics hydration; thread-level rows.
    reuse_note: One client, per-product category/forum ids and per-product acceptance.
  zendesk_help_center_articles:
    lane: official
    contract: >-
      GET /api/v2/help_center/<locale>/sections/<id>/articles.json -- editorial release-note
      articles with title/body/created_at. This is what PR #52 implements, for OFFICIAL ingestion.
    reuse_note: >-
      Article rows are vendor-authored and can never be consensus evidence.
  zendesk_community_posts:
    lane: consensus
    contract: >-
      GET /api/v2/community/posts.json and /api/v2/community/topics.json -- USER-authored posts
      with details/created_at/html_url/comment_count, paginated by the same next_page envelope.
      A DIFFERENT endpoint family and response contract from Help Center articles.
    reuse_note: >-
      NOT supplied by PR #52. The likely shared surface is the lower-level request + pagination +
      byte-cap client (same host, same envelope shape, same anonymous auth model); the article and
      community record contracts, lane assignment and acceptance semantics stay distinct. Building
      it is out of scope for this sprint -- this entry records the split, not an implementation.
  github_issues:
    lane: consensus
    contract: GitHub Issues REST API; issue-level rows with created_at and body.
    reuse_note: Anonymous works; GITHUB_TOKEN only raises rate limits.
  discourse_json:
    lane: consensus
    contract: Anonymous /latest.json and /search.json; topic/post permalink rows.
    reuse_note: PR #53 adds the shared primitive; instances differ only by base URL and scoping.
  rss_atom:
    lane: consensus
    contract: Feed windows (not archives); item/entry rows with pubDate/updated.
    reuse_note: Report-bearing feeds only -- vendor announcement feeds are excluded by acceptance.
  microsoft_learn_qna:
    lane: consensus
    contract: Learn Q&A search RSS driven by exact KB/build/version terms.
    reuse_note: Proven for windows-11; per-product proof is still per-product.
  microsoft_office_updates:
    lane: official
    contract: Learn officeupdates release/version history pages.
    reuse_note: Known-issues content is vendor-authored and never consensus evidence.
  reddit_source:
    lane: consensus
    contract: Reddit search JSON; post-level rows.
    reuse_note: Succeeds for davinci, blocked for every Adobe product -- reliability is asymmetric.
  public_rest_api:
    lane: official
    contract: Vendor REST endpoint returning release/news objects.
    reuse_note: Per-vendor; nothing generic to share yet.
  archive_recheck:
    lane: consensus
    contract: Archive snapshot verification of URLs already known.
    reuse_note: Durability tool, not a discovery method -- it cannot expand supply.
  sitemap_delta:
    lane: official
    contract: sitemap.xml diffed across runs for new release-note URLs.
    reuse_note: Discovery hint only; release date must still come from the page.
  none_yet:
    lane: any
    contract: No framework identified -- platform or contract still unknown.
    reuse_note: Anything here needs a probe before it can be planned.

# Products AUXSAYS treats as strategic. Every one of these, plus every enabled-ingestion product,
# MUST carry a product_source_audit entry -- so "no source research has been done" is a recorded
# state rather than an absence. Only configured product_ids can appear here; DJI Mimo is a named
# strategic interest that is NOT a configured product, so it is tracked as a product candidate and
# cannot have an audit row yet.

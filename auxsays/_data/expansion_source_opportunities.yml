schema_version: 1
# AUXSAYS source-expansion backlog: additional evidence sources for products ALREADY tracked.
#
# WHY THIS FILE LIVES IN _data (measured, not assumed): `auxsays/_config.yml` has no `exclude:`
# list, so Jekyll copies `auxsays/scripts/**` into the built site -- every collector, adapter and
# test fixture is currently fetchable at https://auxsays.com/scripts/... (verified 2026-08-13:
# /scripts/lib/http.py -> 200). Underscore-prefixed data directories are NOT copied
# (/_data/patch_products.yml -> 404), and every template reference is key-specific
# (`site.data.<key>`) with no generic iteration, so adding keys here renders nothing. `_data` is
# therefore the LESS exposed location, which is the opposite of the usual assumption.
#
# This file is planning/backlog data. It is never read by the pipeline, never a source of
# evidence, and must never be confused with `patch_ingestion_sources.yml` (production config).
#
# DOCTRINE. Discovery-method quality never weakens acceptance. Wherever a report is found, it
# counts only if `base.apply_acceptance_gates` is satisfied: exact product, exact patch/version,
# report date on/after release where known, specific report URL, concrete user-facing issue --
# official notes, announcements, generic discussion, search-result pages, pre-release complaints
# and duplicates never count. Different discovery methods, same acceptance rules.
#
# Method CLASSES (transport, bounds, health semantics) are documented separately in
# `auxsays/scripts/README-discovery-methods.md` (PR #53). This file is the per-product backlog:
# which concrete source serves which product, what has actually been measured, and what the next
# experiment is. Keep the two in sync rather than duplicating method-class detail here.

# Deterministic lifecycle. Every opportunity carries exactly one.
lifecycle_states:
  discovered: Named and classified; nothing measured yet.
  needs_probe: Requires a transport/structure measurement before it can be judged.
  transport_proven: Endpoint answers and its structure is understood; acceptance not yet tested.
  acceptance_probe_needed: Transport proven; must still prove patch-specific rows survive gating.
  viable: Transport + patch specificity + supply all measured adequate; not yet implemented.
  blocked: Measured refusal (challenge page, 403/429, empty body) -- fail closed, not silent.
  broken: Previously worked, now fails structurally (parser or endpoint contract changed).
  low_supply: Reachable and parseable but too few patch-specific rows to justify a lane.
  low_confidence: Reachable but identity/version attribution is unreliable.
  rejected: Deliberately not pursued; `notes` records why.
  production_candidate: Viable and scheduled for implementation.
  implemented: Shipped as a registered method in `collector_ownership.ALLOWED_METHODS`.

# Evidence ladder. NEVER claim a level above what was actually measured. "A browser can open it"
# is not a proof level. The HelpX lesson: helpx.adobe.com is reachable locally and times out in
# GitHub Actions on every User-Agent class (run 31530112187, 12/12), so local_reachable says
# nothing about actions_reachable.
proof_levels:
  none: Not measured.
  local_reachable: Answered from a developer machine.
  actions_reachable: Answered from a GitHub Actions runner.
  structure_proven: Response shape parsed; the fields a lane needs were located.
  patch_specificity_proven: Rows can be tied to an exact patch version.
  supply_proven: Enough qualifying rows exist per release to be worth collecting.
  production_proven: A scheduled run produced accepted evidence.

opportunities:

  # ---------------------------------------------------------------------------------------
  # A. REUSE THE ALREADY CI-PROVEN ADOBE ALGOLIA CHAIN (highest leverage, zero new transport)
  # The chain searchToken -> Algolia -> getTopics is CI-proven for Acrobat (main) and Premiere
  # (PR #51). Facet enumeration on 2026-08-13 measured per-product supply on the SAME index,
  # so extending it is configuration plus product-specific acceptance -- not a new collector.
  # Exact `category_title` labels were measured because guessing them fails silently: the
  # filter "Adobe Photoshop" returns 0 hits; the real label is "Photoshop".
  # ---------------------------------------------------------------------------------------

  - opportunity_id: adobe-algolia-photoshop
    product_ids: [adobe-photoshop]
    source_name: Adobe Community (Photoshop boards) via keyless Algolia
    source_type: community_search_api
    lane: consensus
    official_or_community: community
    domain: community.adobe.com
    entry_point: https://community.adobe.com/search/searchToken
    discovery_method: adobe_community_algolia_search
    auth_requirement: none
    proof_level: structure_proven
    measured_at: 2026-08-13
    measurement: >-
      searchToken 200 (client_id + token + availableIndexes=[adobedme-en-unified]); facet query
      200, index-wide nbHits 5618. category_title supply: "Photoshop" 4573, "Photoshop ecosystem"
      2797, "Photoshop (Beta)" 565, "Photoshop Elements" 462. A "Bug Reports" forum_title exists
      (1523 index-wide) alongside an "Announcements" forum that must be excluded by board scoping.
    patch_specificity: expected_good
    expected_supply: high
    reuse_scope: [adobe-photoshop]
    shared_framework: adobe_community_algolia
    status: acceptance_probe_needed
    blocking_unknowns:
      - Exact category id behind category_title "Photoshop" and its Bug Reports forum id.
      - Whether Photoshop titles carry version tokens as reliably as Premiere's (25.x/26.x).
      - Whether "Photoshop ecosystem"/"(Beta)"/"Elements" must be excluded as separate products.
    next_experiment: >-
      Facet-enumerate category+forum ids for the Photoshop boards, then run the PR #51 identity
      gate over one release's candidates offline and count what would survive acceptance.
    notes: >-
      Photoshop official ingestion is separately blocked -- helpx.adobe.com is CI-unreachable
      (classification C, root cause unresolved), which is why PR #28 was a NO-GO activation.
      Consensus here is useful only once an official record exists to attach evidence to.


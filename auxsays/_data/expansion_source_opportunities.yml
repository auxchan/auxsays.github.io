    next_experiment: >-
      Enumerate community topics, pull one product's posts for a known release window, and count
      how many carry an exact version token in title or body. Decide go/no-go on that count.
    notes: >-
      Highest reuse-per-unit-effort finding in this audit: four enabled-but-silent products, one
      vendor host, and it would convert them into products that can actually answer "should I
      install this?".
      CLASSIFICATION CORRECTION: PR #52 implements the Zendesk Help Center ARTICLES API for
      OFFICIAL ingestion. This opportunity is the Zendesk COMMUNITY POSTS API for CONSENSUS
      discovery -- a different endpoint family, a different response contract, a different
      evidence lane and different acceptance semantics. PR #52 does NOT supply this transport.
      What is plausibly shared is the lower-level request/pagination/byte-cap client (same host,
      same next_page envelope, same anonymous auth model); the record contracts stay distinct.
      Building it is out of scope for this sprint.


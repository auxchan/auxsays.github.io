    discovery_method: adobe_community_algolia_search
    auth_requirement: none
    proof_level: structure_proven
    measured_at: 2026-08-13
    measurement: >-
      Same chain and index. category_title "Lightroom Classic" 6520 documents -- the largest
      measured supply of any staged Adobe product; "Lightroom ecosystem (Cloud-based)" 1042 is a
      DIFFERENT product and must not be merged into it.
    patch_specificity: unproven
    expected_supply: high
    reuse_scope: [adobe-lightroom-classic]
    shared_framework: adobe_community_algolia
    status: acceptance_probe_needed
    blocking_unknowns:
      - Lightroom Classic versioning (14.x) vs Lightroom (cloud) -- identity must not cross.
      - Camera Raw version coupling: many LrC defects are actually Camera Raw defects.
    next_experiment: Enumerate the LrC category/forum ids and measure version-token density in titles.
    notes: Highest measured community supply among the staged Adobe products.


opportunities:

  # ---------------------------------------------------------------------------------------
  # A. REUSE THE ALREADY CI-PROVEN ADOBE ALGOLIA CHAIN (highest leverage, zero new transport)
  # The chain searchToken -> Algolia -> getTopics is CI-proven for Acrobat (main) and Premiere
  # (PR #51). Facet enumeration on 2026-08-13 measured per-product supply on the SAME index,
  # so extending it is configuration plus product-specific acceptance -- not a new collector.
  # Exact `category_title` labels were measured because guessing them fails silently: the
  # filter "Adobe Photoshop" returns 0 hits; the real label is "Photoshop".
  # ---------------------------------------------------------------------------------------

  - opportunity_id: adobe-algolia-photoshop
    product_ids: [adobe-photoshop]
    source_name: Adobe Community (Photoshop boards) via keyless Algolia
    source_type: community_search_api
    lane: consensus
    official_or_community: community
    domain: community.adobe.com
    entry_point: https://community.adobe.com/search/searchToken
    discovery_method: adobe_community_algolia_search
    auth_requirement: none
    proof:
      local_reachable: proven
      actions_reachable: unknown
      structure_proven: proven
      patch_specificity_proven: unknown
      supply_proven: unknown
      production_proven: unknown
    transport_precedent: >-
      The searchToken -> Algolia -> getTopics chain is Actions-proven for adobe-acrobat-reader /
      adobe-acrobat-pro (committed adobe_community_algolia_search success rows) and for
      adobe-premiere-pro on the PR #51 branch. That is TRANSPORT precedent only: it says nothing
      about this product's board ids, version-token density or per-release supply.
    last_checked: 2026-08-13
    recheck_after_days: 30
    measurement: >-
      searchToken 200 (client_id + token + availableIndexes=[adobedme-en-unified]); facet query
      200, index-wide nbHits 5618. category_title supply: "Photoshop" 4573, "Photoshop ecosystem"
      2797, "Photoshop (Beta)" 565, "Photoshop Elements" 462. A "Bug Reports" forum_title exists
      (1523 index-wide) alongside an "Announcements" forum that must be excluded by board scoping.
    patch_specificity: expected_good
    expected_supply: high
    reuse_scope: [adobe-photoshop]
    shared_framework: adobe_community_algolia
    status: acceptance_probe_needed
    blocking_unknowns:
      - Exact category id behind category_title "Photoshop" and its Bug Reports forum id.
      - Whether Photoshop titles carry version tokens as reliably as Premiere's (25.x/26.x).
      - Whether "Photoshop ecosystem"/"(Beta)"/"Elements" must be excluded as separate products.
    next_experiment: >-
      Facet-enumerate category+forum ids for the Photoshop boards, then run the PR #51 identity
      gate over one release's candidates offline and count what would survive acceptance.
    notes: >-
      Photoshop official ingestion is separately blocked -- helpx.adobe.com is CI-unreachable
      (classification C, root cause unresolved), which is why PR #28 was a NO-GO activation.
      Consensus here is useful only once an official record exists to attach evidence to.


# Deferred, deliberately NOT done on this branch.
deferred_follow_ups:
  - id: scripts-web-exposure
    classification: build-output / SEO / implementation-surface hygiene
    finding: >-
      auxsays/_config.yml declares no `exclude:`, so Jekyll copies auxsays/scripts/** into the
      built site; 111 files are served (verified https://auxsays.com/scripts/lib/http.py -> 200).
      The repository is public, so this is NOT a secret-leak emergency.
    required_proof_for_the_fix: >-
      before: scripts present in _site; after: scripts absent from _site; site still builds; site
      functionality unchanged.
    scope_note: Must be its own tiny PR. Not mixed into expansion-inventory-foundation.

# PER-PRODUCT, PER-LANE SOURCE AUDIT. Answers "what sources do we have, what is missing,
# and where should we keep looking?" for EVERY configured product -- all 47, so the
# products least likely to be remembered cannot decay into an ignorable warning.
#
# OFFICIAL and CONSENSUS are audited SEPARATELY because they fail independently, and
# because a single product-level status produced flatly contradictory records: Premiere was
# labelled no_viable_source_found while its own notes described PR #51 as a working path.
#
# `no_viable_source_found` means literally NO viable source is known for that lane. It may
# never mean "we have one source and cannot find a second" -- that is diversification debt
# and lives in `diversification_state`. The validator enforces the distinction: a lane with
# any current or pending method cannot be no_viable_source_found.
#
# `opportunity_ids` in a lane must reference opportunities of THAT lane. An official-lane
# opportunity can never close a consensus gap (the microsoft-windows-11 defect).
#
# Opportunities are never invented to satisfy coverage: needs_source_research with an empty
# list is the honest answer and validates cleanly.
audit_lane_states:
  production_source_present: A method is operational in production for this lane today.
  production_source_degraded: >-
    Configured and executing, but yielding no records or no evidence -- running is not the
    same as working.
  pending_production_source: >-
    A source is proven but not yet in production (for example, sitting in an open PR).
  opportunities_identified: No operational or pending source, but a same-lane opportunity exists.
  needs_source_research: No operational source, no pending source, no same-lane opportunity.
  no_viable_source_found: Researched, and NO viable source exists for this lane at all.
audit_diversification_states:
  sufficient: Multiple independent sources already carry this lane.
  opportunities_identified: A second-source candidate is identified but unproven.
  needs_source_research: One source exists and no alternative has been researched.
  no_viable_additional_source_found: >-
    A source exists, and additional sources were researched and found non-viable. This is
    diversification debt, NOT an absence of sources.
  not_applicable: No source exists yet, so diversification is not yet the question.
product_source_audit:
  openai-chatgpt:
    official:
      state: needs_source_research

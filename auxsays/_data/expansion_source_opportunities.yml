  - opportunity_id: elgato-zendesk-community-posts
    product_ids:
      [elgato-stream-deck, elgato-wave-link, elgato-camera-hub, elgato-4k-capture-utility]
    source_name: Elgato Help Center community posts (Zendesk Community API)
    source_type: vendor_community_json
    lane: consensus
    official_or_community: community
    domain: help.elgato.com
    entry_point: https://help.elgato.com/api/v2/community/posts.json
    discovery_method: zendesk_community_posts
    auth_requirement: none
    proof_level: structure_proven
    measured_at: 2026-08-13
    measurement: >-
      HTTP 200 in 457 ms, 5932 B, keyless. Envelope: count/page/page_count/per_page/next_page/
      previous_page/posts[]. Post fields include created_at, details, html_url, comment_count,
      closed, frozen, follower_count. Companion /api/v2/community/topics.json 200 (351 ms) lists
      topics with html_url + created_at, so board scoping is available the same way Premiere
      scopes to a Bug Reports forum.
    patch_specificity: unproven
    expected_supply: unknown
    reuse_scope:
      [elgato-stream-deck, elgato-wave-link, elgato-camera-hub, elgato-4k-capture-utility, figma]
    shared_framework: zendesk_help_center
    status: acceptance_probe_needed
    blocking_unknowns:
      - Do Elgato community posts name exact software versions (6.9.x) often enough to pass gating?
      - Which topic ids correspond to per-product boards vs general discussion?
      - Actions reachability (help.elgato.com official ingestion is already exercised in CI, which
        is a positive signal for the same host but not a measurement of this path).
    next_experiment: >-
      Enumerate community topics, pull one product's posts for a known release window, and count
      how many carry an exact version token in title or body. Decide go/no-go on that count.
    notes: >-
      Highest reuse-per-unit-effort finding in this audit: one adapter family, four products, and
      it converts four enabled-but-silent official lanes into products that can actually answer
      "should I install this?". PR #52 already builds the Zendesk transport for the official lane.


<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/jekyll-theme-chirpy.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/auxsays-custom.css' | relative_url }}">
    <script>
      /* ARM THE REVEAL ANIMATION BEFORE FIRST PAINT.
       *
       * The CSS default for `.reveal-up` is VISIBLE, and `html.js-reveal` is what arms the hidden
       * start state. That ordering is deliberate -- no script, no observer, or reduced motion all
       * mean the page simply renders -- but it only works if the class lands before the browser
       * paints. Arming it from the DEFERRED script did not: measured on the live /updates/adobe/
       * page, content painted at 123ms, `js-reveal` arrived at 158ms, and because the armed rule
       * carries `transition: opacity .72s` the content then FADED OUT to opacity 0 and did not
       * return until 1679ms -- a 1.5 second disappearance of the whole page body, 200 frames below
       * 0.95. Arming synchronously here means the hidden state is the first thing ever painted, so
       * the only transition a reader sees is the intended fade IN.
       *
       * This script may never leave content hidden. Three ways it refuses to:
       *   - no IntersectionObserver, or reduced motion -> it does not arm at all;
       *   - it throws -> the class is never added and the visible default stands;
       *   - auxsays.js never runs (404, parse error, blocked) -> nothing would ever add
       *     `.is-visible`, so the timeout below un-arms and the page shows itself.
       * The flag is set by auxsays.js once it has actually wired the observer, not merely loaded.
       */
      (function () {
        try {
          if (typeof IntersectionObserver !== 'function') return;
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          var root = document.documentElement;
          root.classList.add('js-reveal');
          window.setTimeout(function () {
            if (!window.__auxRevealReady) root.classList.remove('js-reveal');
          }, 2000);
        } catch (e) { /* never let arming failure hide the page */ }
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4SVH0YHB76"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4SVH0YHB76');
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script defer src="{{ '/assets/js/auxsays.js' | relative_url }}"></script>
  </head>
  <body class="aux-page {{ page.layout }}">
    <div class="aux-bg" aria-hidden="true"></div>

    <div class="systems-field" aria-hidden="true">
      <div class="systems-lottie" id="systems-lottie"></div>
      <div class="systems-rings">
        <span class="systems-ring systems-ring--1"></span>
        <span class="systems-ring systems-ring--2"></span>
        <span class="systems-ring systems-ring--3"></span>
      </div>
      <div class="systems-grid"></div>
    </div>

    <header class="aux-topbar">
      <div class="aux-topbar-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-copy">
            <strong>{{ site.title }}</strong>
            <em>{{ site.tagline }}</em>
          </span>
        </a>

        <nav class="aux-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="is-active"{% endif %}>Home</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}class="is-active"{% endif %}>About Aux</a>
          <a href="{{ '/articles/' | relative_url }}" {% if page.url contains '/articles/' or page.layout == 'aux-post' %}class="is-active"{% endif %}>Articles</a>
          <a href="{{ '/updates/' | relative_url }}" {% if page.url contains '/updates/' or page.layout == 'aux-update' or page.layout == 'aux-updates' %}class="is-active"{% endif %}>Patch Feed</a>
          <a href="{{ '/systems-monitor/' | relative_url }}" {% if page.url contains '/systems-monitor/' %}class="is-active"{% endif %}>Systems Monitor</a>
        </nav>
      </div>
    </header>

    <main class="aux-shell">
      {{ content }}
    </main>

    <footer class="aux-footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}.</span>
      <span>Signals • Systems • Articles • <a href="{{ '/updates/' | relative_url }}">Patch Feed</a> • <a href="{{ '/updates/methodology/' | relative_url }}">Methodology</a></span>
    </footer>
  </body>
</html>

lang: en
timezone: America/Los_Angeles

title: AUXSAYS
tagline: Tactical knowledge for creators who want control

description: >-
  Tactical knowledge for creators who want control. Real free AI tools,
  creator workflows, automation productivity, and signal-first systems thinking.

url: "https://auxsays.com"
baseurl: ""

github:
  username: auxchan

social:
  name: Aux
  email: ""
  links: []

avatar: "/assets/img/aux-about-portrait.jpg"

# Patch-alert email capture (framework only). The signup form stays completely
# inert until BOTH enabled:true AND action_url are set — so nothing collects or
# sends until you connect Buttondown. No API key lives here; the embed endpoint
# is a public POST URL. (Automated "verdict changed" sends use a separate GitHub
# Actions secret, added later.)
newsletter:
  enabled: false
  provider: Buttondown
  action_url: ""   # after creating the account, paste e.g. https://buttondown.com/api/emails/embed-subscribe/<your-username>
  heading: "Get the verdict before you update"
  blurb: "One email when a tracked release crosses into a clear, wait, or avoid verdict. No spam — unsubscribe anytime."

theme: jekyll-theme-chirpy

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-include-cache

paginate: 8
permalink: /articles/:title/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  -
    scope:
      path: "_posts"
      type: posts
    values:
      layout: aux-post
      comments: false
      toc: false

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

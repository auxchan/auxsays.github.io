lang: en
timezone: America/Los_Angeles

title: AUXSAYS
tagline: Tactical knowledge for creators who want control

description: >-
  Tactical knowledge for creators who want control. Real free AI tools,
  creator workflows, automation productivity, and signal-first systems thinking.

url: "https://auxsays.com"
baseurl: ""

github:
  username: auxchan

social:
  name: Aux
  email: ""
  links: []

avatar: "/assets/img/aux-about-portrait.jpg"

# Community-evidence monitoring status (per exact patch, derived from _data/evidence_method_health.yml).
# A record shows a positive-side monitoring status ONLY when live collector telemetry supports it; any
# blocked / broken / stale / partial / disabled / future / missing signal fails closed. These tune the
# thresholds; the model itself lives in _includes/monitoring-status.html and is separate from the verdict.
monitoring_min_healthy_methods: 2   # fresh, post-release success/no_results methods required for coverage
monitoring_max_age_days: 14         # a method whose last_run is older than this is not "fresh"

theme: jekyll-theme-chirpy

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-include-cache

paginate: 8
permalink: /articles/:title/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  -
    scope:
      path: "_posts"
      type: posts
    values:
      layout: aux-post
      comments: false
      toc: false

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# MINIMAL NECESSARY PUBLIC DISCLOSURE for the BUILT SITE.
#
# Exclusion is not deletion and not secrecy. CI still reads the repository checkout, every
# test stays registered and runnable, and nothing a reader needs in order to judge a patch
# moves. What stops being copied verbatim into _site is the acquisition, verification and
# scoring implementation, the operator tooling, and the internal build notes.
#
# MEASURED, by building the real tree: the baseline artifact is 1,841 files / 46 MB and
# includes 191 .py files, the browser-capture tooling with a sample of captured data, a CSS
# source map, a test fixture, and three raw PASS/FAIL validation notes at the domain root.
# Every path below was confirmed live at HTTP 200 before being listed.
#
# PATTERN SEMANTICS, read off jekyll-4.4.1/lib/jekyll/entry_filter.rb and confirmed in Ruby:
# an entry is excluded when File.fnmatch?(pattern, entry) with NO FLAGS, or when
# entry.start_with?(pattern).
#   * No flags means `*` CROSSES `/`, so one "*.test.mjs" line catches any depth. Verified:
#     fnmatch?("*.test.mjs", "assets/js/patch-table-sort.test.mjs") => true.
#   * The trailing slashes are LOAD-BEARING, because of that raw start_with?. Verified:
#     "scripts" also matches "scripts-foo/thing.txt"; "scripts/" does not.
#   * Jekyll's DEFAULT_EXCLUDES still apply once this key is set, so Gemfile and friends
#     stay unpublished.
#   * A leading [._#~] basename is filtered at EVERY depth, which is why _data/, _layouts/
#     and the four __init__.py were never published to begin with.
exclude:
  # Acquisition, verification and scoring implementation, its tests and fixtures, and the CI
  # manifest with its per-suite check counts. 191 .py are published today; this takes them to 0.
  - "scripts/"
  # Operator browser-capture tooling for bot-blocked sources, including a sample of captured
  # data. By the disclosure criteria this is the most sensitive directory on the site.
  - "tools/"
  # Node test files, which live beside genuinely shipped modules rather than under scripts/.
  # Unanchored on purpose: `*` crosses `/`, so this holds at any depth.
  - "*.test.mjs"
  # Internal validation notes, served at the domain root as raw PASS/FAIL output.
  - "PATCH_FEED_FIX_VALIDATION.txt"
  - "PATCH_FEED_STABLE_REPAIR_VALIDATION.txt"
  - "PATCH_PAGE_GRAPH_SPACING_VALIDATION.txt"
  # Internal engineering notes, nine of which were served at the domain root. Listing the
  # three validation notes by name was not enough: this whole class was missed, and the
  # titles alone describe adapter strategy, ingestion reliability and consensus policy.
  # Matched by pattern rather than by name so the next note written is caught too.
  - "AUXSAYS_*.md"
  # Build configuration: names the dependency set and the build scripts.
  - "package.json"
  # Directory READMEs are written for whoever maintains the directory, not for a reader.
  - "*README.md"

# No CSS source maps in the published artifact. The one shipped today is generated by Sass
# from the theme's .scss, so it is a BUILD OUTPUT and `exclude:` above cannot match it --
# an exclude line for it was written, measured as inert, and removed rather than left in
# place looking like a control. The theme is third-party and open, so its map discloses
# nothing proprietary; this also pre-empts a map for auxsays-custom.scss should one appear.
sass:
  sourcemap: never

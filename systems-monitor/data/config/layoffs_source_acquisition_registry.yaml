coverageGaps:
  - Industry Credit Conditions has no accepted official industry-granular series; SLOOS is an aggregate candidate only.
  - Import Exposure requires an accepted trade-to-industry crosswalk before it can be calculated.
  - Productivity / Automation has an official productivity source but no approved direct automation measure.
  - Energy / Input Shock requires an exact EIA route and rights scope before activation.
  - Broad Sales / Revenue has no single universal official series; program-specific Census series must not be presented as economy-wide.
  - CPS permanent-job-loser and temporary-layoff series keys must be selected from official LN metadata, not guessed.
  - BED establishment closure/death concepts require metadata joins and definitional review to prevent closure, death, contraction, and job-loss conflation.
  - Bankruptcy filings are legal filings and must not be represented as firm deaths, closures, or layoffs.

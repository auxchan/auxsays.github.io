name: Build and Deploy Chirpy Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily, so the deploy-time projections (monitoring state, live-consensus eligibility) are
  # re-judged against the clock even on a day no lane commits: a live claim whose collection went
  # stale is withdrawn at the next build, not at the next push. The limit is this workflow itself --
  # if the scheduled build stops running, the deployed static HTML stays frozen at its last build,
  # and nothing here can notice. The schedule shortens that window; it cannot close it.
  schedule:
    - cron: '41 5 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # BUNDLE_GEMFILE is explicit because the Gemfile lives in auxsays/, not at the
      # repository root: without it the action resolves the wrong project. bundler-cache
      # installs from the TRACKED lock in deployment mode, which is what stops a silent
      # re-resolution. Before the lock existed this job ran `bundle install` bare and
      # re-resolved every gem on every deploy, so the published site was whatever rubygems
      # served that minute -- measured: the live page emitted jekyll-seo-tag 2.9.1 while a
      # local build of the same commit emitted 2.9.0, and the unconstrained THEME could have
      # changed the markup of every page with no commit touching the repository.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: auxsays/Gemfile
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node for logo generation and Systems Monitor
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Python for source health snapshot
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source health dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Install image metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      # The gems are already installed by setup-ruby above, from the lock. What remains is to
      # prove the lock was HONOURED rather than quietly rewritten. An absent lock must fail the
      # build here, not fall back to fresh resolution -- that fallback is the whole defect.
      - name: Verify the dependency lock was used, not rewritten
        working-directory: ./auxsays
        env:
          BUNDLE_GEMFILE: Gemfile
        run: |
          set -euo pipefail
          test -f Gemfile.lock || { echo "::error::Gemfile.lock is missing. Refusing to resolve dependencies at deploy time."; exit 1; }
          # Frozen mode refuses to change the lock; if the Gemfile and lock disagree this fails.
          bundle config set --local frozen true
          bundle check
          # And prove it byte-for-byte: installation must not have altered the tracked lock.
          if ! git diff --quiet -- Gemfile.lock; then
            echo "::error::Gemfile.lock changed during installation. The deployed dependency set would not match the committed one."
            git --no-pager diff -- Gemfile.lock
            exit 1
          fi
          bundle list | sed -n '1,12p'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Strip image metadata
        working-directory: ./auxsays
        run: bash scripts/strip_image_metadata.sh assets/img

      - name: Generate source health snapshot
        run: python auxsays/scripts/source_health_snapshot.py

      # Position is load-bearing: this runs BEFORE `bundle exec jekyll build`, so the product and
      # company pages render the state collection actually reached rather than a static editorial
      # label. Before it existed, 29 of 47 products publicly claimed "Monitoring active" with no
      # enabled ingestion source, and four enabled-but-refused sources claimed nothing was wrong.
      - name: Generate public monitoring projection
        run: python auxsays/scripts/build_monitoring_projection.py

      # Also BEFORE `jekyll build`: `_includes/maturity-state.html` renders a stored live claim as
      # live only when this lists the page. It reads and never writes records, and on unreadable
      # inputs writes an empty list and exits 0 -- every claim then reads Verified reports.
      - name: Build the live-consensus eligibility projection
        run: python auxsays/scripts/build_live_eligibility_projection.py

      - name: Validate logo assets
        run: python auxsays/scripts/validate_logo_assets.py

      - name: Run generated record QA (publication-strict)
        # PUBLICATION mode, which is the whole point of the flag. A record that names two
        # actions is a warning for the writeback lane -- one stale record must not discard a
        # whole evidence run -- and an ERROR here, because this step is what puts the page in
        # front of a reader. Without the flag this invocation detected the contradiction and
        # deployed it anyway (AUX-009).
        #
        # Position is load-bearing: this runs BEFORE `bundle exec jekyll build`, so a
        # non-zero exit stops the build rather than failing after the site is already made.
        run: python auxsays/scripts/qa_patch_records.py --publish-strict

      - name: Install Systems Monitor dependencies
        run: npm ci --prefix systems-monitor/app

      - name: Validate and build Systems Monitor
        run: npm run validate --prefix systems-monitor/app

      - name: Build site
        working-directory: ./auxsays
        run: bundle exec jekyll build --trace

      - name: Verify Systems Monitor static integration
        run: npm run verify:site --prefix systems-monitor/app

      # Between the build and the upload ON PURPOSE: this is the last point at which the
      # exact bytes that will be served can still be refused. Verified on real builds of
      # this tree -- 223 internal files found on a build without the exclude block (exit 1),
      # clean on a build with it (exit 0) -- so it is proven to catch the real exposure and
      # proven not to fire on a correct build. It is a deny-list of classes that are internal
      # by construction, never an extension allow-list: an allow-list derived from the working
      # tree was measured to miss .map, .xml, .ico and .webmanifest, which exist only in the
      # built site, and would therefore have refused every correct deploy.
      - name: Verify published payload carries no internal implementation
        run: python auxsays/scripts/ci/verify_published_payload.py --site auxsays/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./auxsays/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: DaVinci Evidence Collection

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report without writing evidence or records"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: auxsays-main-writeback
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Collect DaVinci evidence
        env:
          AUXSAYS_REDDIT_DIAGNOSTICS: "1"
          AUXSAYS_REDDIT_REQUEST_DELAY_SECONDS: "0.75"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python auxsays/scripts/run_patch_evidence_collection.py --product-id blackmagic-davinci --since-days 45 --max-pages 5 --dry-run
          else
            python auxsays/scripts/run_patch_evidence_collection.py --product-id blackmagic-davinci --since-days 45 --max-pages 5 --write
          fi

      - name: Build consensus status
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/build_consensus_from_evidence.py

      - name: Promote DaVinci consensus to its records
        # SCOPED to the one product this lane owns. It collects only blackmagic-davinci (see the
        # collection step above), yet this promotion ran unscoped and therefore promoted all 905
        # records. That is not theoretical: 23 minutes after the unscoped form was introduced in
        # b5259931, run d0fd2b81 rewrote 2026-04-30-premiere-pro-26-2.md, replacing a hand-authored
        # `consensus_report` ("Manually reviewed Adobe Community reports naming Premiere Pro 26.2 or
        # 26.2.0 Build 65 describe timeline...") with generated template text. That damage is still
        # on main. `--product-id` already existed when the unscoped line was written (8d93b72c, three
        # days earlier), so the breadth was an unremarked side effect, never a contract.
        #
        # DaVinci is deliberately NOT in lib.report_counts.CONSENSUS_PROMOTION_PRODUCTS, so this
        # scoped promotion carries no retraction obligation.
        #
        # The unscoped form DID serve as a projection-rebuild path for other products -- #75 says so
        # outright, and it is measurable: running it rebuilds obs-studio 32.2.2 from 3 sources to 7.
        # That is why removing it is only safe now: #75 gave obs-studio, powerpoint and windows-11
        # their own scoped steps on obs-evidence-collection.yml, which runs on cron rather than
        # dispatch. Acrobat Pro / Reader still have no scoped promotion anywhere -- see the steps
        # added alongside the others in that lane.
        #
        # The writeback --allow below stays broad ON PURPOSE: the consensus step above runs a GLOBAL
        # reconcile_record_counts, so non-DaVinci records can legitimately change their counts, and
        # automation_writeback fails the whole run when the tree holds material the commit candidate
        # omits. Narrowing the allow without also restoring those records would fail-close the lane.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id blackmagic-davinci \
            --write-all --confirm-write

      - name: QA patch records
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/qa_patch_records.py

      - name: Audit consensus evidence
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/audit_consensus_evidence.py

      - name: Remove transient validation output
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          rm -rf auxsays/_site node_modules .jekyll-cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f auxsays/_data/qa_status.json
          rm -f auxsays/_data/consensus_status.json
          # source_health.yml and patch_ingest_state.json are TRACKED and are in no --allow entry
          # for this lane, so `rm -f` left an unstaged tracked DELETION: material the writeback
          # validators could observe while the commit omitted it (audit_consensus_evidence.py
          # reads patch_ingest_state.json for source-freshness state). Restore the committed
          # content instead -- the tree the validators read is then exactly the tree that gets
          # committed, which is what automation_writeback now enforces fail-closed.
          git checkout -- auxsays/_data/source_health.yml auxsays/_data/patch_ingest_state.json

      - name: Commit material DaVinci evidence changes (conflict-safe writeback)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/lib/automation_writeback.py \
            --message "Update DaVinci evidence collection" \
            --allow auxsays/_data/consensus_evidence.yml \
            --allow auxsays/_data/evidence_method_health.yml \
            --allow 'auxsays/updates/generated/*.md' \
            --validate 'python auxsays/scripts/qa_patch_records.py' \
            --validate 'python auxsays/scripts/audit_consensus_evidence.py' \
            --validate 'python auxsays/scripts/validate_evidence_method_health.py' \
            --max-retries 5 \
            --pages-cmd 'gh workflow run pages.yml --ref main' \
            --pages-max-attempts 3 --pages-backoff 5,15

name: CI integrity

# AUXSAYS protects exact-patch intelligence with ~71 standalone test suites, but until this workflow
# existed nothing ran them automatically -- they were enforced only by an engineer remembering. A
# test that is never run is documentation, not enforcement.
#
# This workflow is READ-ONLY by construction. It never commits, never deploys, never touches Actions
# state, and the runner it invokes fails the build if any test writes a tracked file or one of the
# gitignored status snapshots.
#
# Shape: four `shard` jobs run the governed suites in parallel and each leaves a receipt; one
# `integrity` job then proves those receipts are the whole governed population exactly once, and
# runs the downstream gates. The run is green only if that job is. (AUX-070)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege. Every other workflow in this repo needs `contents: write` because it commits
# evidence; a test workflow does not, and must not inherit that by habit.
permissions:
  contents: read

# Deliberately NOT `auxsays-main-writeback`. Sharing that group would let a PR test run queue behind
# -- or cancel -- evidence collection and Pages deployment. Superseded runs for the same PR are
# cancelled: the replacement re-judges the WHOLE pull request against its base, so nothing is lost.
#
# Every push run is keyed by the WINDOW it judges (`before` and `after`), not by ref. Keying by ref
# used to be harmless, because every gate here re-tested the whole tree; the evidence-loss step is
# the first that judges a window. With one shared group for main, a second push cancelled the first
# push's run before it reached that step, and the first window -- including any evidence it lost --
# was never judged by anything. A queued run does not fix it either: a group holds one pending run,
# and a third entrant cancels it. Keying by `after` alone is not enough: force-push main away and
# back, and the re-push of an old tip lands in the old tip's group with a different `before`. The
# event name is in the key too, so a manual dispatch on a commit cannot cancel that commit's push.
#
# The two `||` halves are one key written for GitHub's expression syntax: a pull request yields its
# number twice (so its superseded runs still share a group); a push yields `before` and `after`; a
# dispatch, which has no `before`, yields an empty field and its commit.
concurrency:
  group: >-
    ci-integrity-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.before }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Keep the checkout pristine: no __pycache__ from any step. .gitignore already covers it, but the
  # point of this workflow is that CI leaves nothing behind, not that .gitignore hides what it does.
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: "utf-8"

# Every run: step under `bash --noprofile --norc -eo pipefail`. With no shell named, GitHub runs
# `bash -e`, which has no pipefail: a failing command on the left of a pipe is swallowed, so a
# piped gate can pass on a failure. test_ci_integrity_sharding.py executes these steps under
# -eo pipefail, and pins this default so that simulation and CI agree. No step here contains a
# pipe today, so the default changes no current step's outcome; it binds every future one.
defaults:
  run:
    shell: bash

jobs:
  # The governed suites, run as four parallel shards. Each shard is a whole, isolated job -- its own
  # runner, its own checkout -- and runs every per-suite protection of run_integrity_tests.py on its
  # slice: the Results line, the governed check count, the exit status, printed FAIL lines, the
  # 900 s timeout, and the tracked-file and watched-ignored-file mutation guard. The slice comes from
  # integrity_suites.txt (what runs and what counts) and suite_duration_hints.json (where it runs;
  # scheduling only, it cannot drop a suite or change a count).
  #
  # A shard decides nothing about the run. It leaves a receipt, and the `integrity` job below is the
  # only place receipts become a verdict.
  #
  # The shard count appears four times -- the matrix, the --shard argument, the artifact name and the
  # aggregator's --shards -- because a matrix cannot read `env`. test_ci_integrity_sharding.py parses
  # all four from this file and requires them to agree.
  shard:
    name: integrity shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    # The "~5.5 min for 66 suites, 20 min is generous" budget this carried stopped being true as
    # the suite count grew to 96. Measured on the ten most recent runs: 10, 13, 13, 14, 16, 17,
    # 18, 19, 19 and 20 minutes -- and e174bf89 on main took 19m against the 20m ceiling, one
    # minute of headroom, for content that had already passed. The run that forced this change
    # (37718129073) reported 96/96 PASSED and was cancelled two seconds later with no time left
    # to write its summary, which is the worst possible failure shape: a green suite reported as
    # a red build.
    #
    # 45 min is a little over twice the slowest observed run, so ordinary runner variance cannot
    # reach it, while a genuinely hung job is still bounded. The real per-suite ceiling is
    # unchanged: the runner caps each suite at 900s itself, so one stuck suite cannot consume
    # this budget quietly.
    #
    # By 123 suites the single job took ~34 min of that 45 (run 41932362848: 1,949 s of suite
    # time), which is why it is now four shards of roughly 490 s each. The ceiling is kept per
    # shard rather than cut, so sharding cannot introduce a timeout the serial job did not have.
    timeout-minutes: 45
    strategy:
      # Every shard runs to its own verdict. Failing fast would cancel the others, and a cancelled
      # shard says nothing about how much of the population was actually red.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        # No test needs git history: every suite that uses git builds its own repository in a temp
        # directory, and a depth-1 checkout was verified to produce identical results.
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      # test_public_method_health_presentation renders the SHIPPED Liquid template with the real
      # gem, and SKIPS those assertions when it is missing. Without this it reported "21/21 passed"
      # on the runner while silently dropping 51 of its 72 checks -- caught only by diffing CI check
      # totals against a local run. Installing the gem is what makes the CI number match.
      - name: Install the Liquid gem so template assertions actually run
        # --user-install because the runner's system gem dir (/var/lib/gems) is not writable and
        # this job deliberately does nothing as root. GEM_HOME is exported so the `ruby` the tests
        # spawn resolves the gem.
        #
        # REQUIRED, and the tradeoff is deliberate. This is the only step that reaches the network,
        # so it does make the job depend on rubygems.org. The alternative is worse: without the gem
        # test_public_method_health_presentation runs 21 of its 72 checks while printing
        # "21/21 passed, 0 failed" -- and it emits only 6 SKIP lines for 51 dropped assertions,
        # because the rest live inside `if liquid_ok:` blocks and are never announced at all. A
        # best-effort install therefore bought undisclosed coverage loss, not resilience.
        #
        # It fails loudly here instead. The governed check count in the manifest would catch it
        # regardless (CHECK COUNT DRIFT: ran 21, declares 72), so the only question was whether the
        # failure arrives with a clear cause at install time or three minutes later; this is the
        # clearer one. Retried to absorb a transient blip rather than a real outage.
        run: |
          for attempt in 1 2 3; do
            gem install --no-document --user-install liquid -v 4.0.4 && break
            echo "gem install attempt $attempt failed; retrying" && sleep 5
          done
          echo "GEM_HOME=$(ruby -e 'print Gem.user_dir')" >> "$GITHUB_ENV"

      - name: Report environment
        run: |
          python --version
          python -c "import yaml; print('PyYAML', yaml.__version__)"
          git --version
          ruby --version
          ruby -e "require 'liquid'; puts %(liquid #{Liquid::VERSION})"

      # Fails when a test file exists that no category claims, when a category names a file that is
      # gone, or when a suite is classified twice. Runs first so a classification mistake is
      # reported immediately rather than after five minutes of tests.
      - name: Verify the test manifest is closed-world
        run: python auxsays/scripts/ci/run_integrity_tests.py --check-manifest

      # This shard's slice of every executed suite. A missing Results line, an import error, a
      # crash or a timeout is a failure -- never a skip. Exits 2 if any tracked file or watched
      # status snapshot changed while the tests ran.
      #
      # The receipt is written to runner temporary storage, OUTSIDE the checkout (the runner refuses
      # a path inside it), after every suite and once more at the end, so a shard that is killed
      # mid-run still leaves a receipt that says `running` rather than none at all.
      - name: Run integrity suites (this shard)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python auxsays/scripts/ci/run_integrity_tests.py --suite all --shard "$SHARD/4" \
            --receipt "$RUNNER_TEMP/integrity-receipt/receipt.json"

      # Belt and braces alongside the runner's own hash check, made about THIS checkout: the
      # integrity job's final proof never sees the checkout these suites ran in.
      - name: Prove the checkout was not modified
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "::error::CI produced repository changes; it must be read-only"
            git status --porcelain --untracked-files=normal
            exit 1
          fi

      # Uploaded whatever happened above, so a failed or timed-out shard still delivers its receipt
      # and the aggregate can name what failed. `always()` only decides that the upload is attempted;
      # it cannot make this job pass. One artifact per shard, named by shard and total. `overwrite`
      # lets a re-run of a failed shard replace that shard's own receipt; the aggregate still
      # requires exactly one complete, clean receipt per shard, and a re-run that fails to upload
      # leaves the failing receipt in place.
      - name: Upload the shard receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integrity-receipt-shard-${{ matrix.shard }}-of-4
          path: ${{ runner.temp }}/integrity-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Stable, unique check name. GitHub required-status rules are keyed on the job/check name, so this
  # must not collide with a job in any other workflow. guarded_merge.py reads this WORKFLOW's run
  # conclusion, and this is the job that decides it.
  #
  # `if: always()` so that it runs -- and fails -- when a shard failed, was cancelled or never
  # started. A skipped job reads as passing to GitHub's required-check rules, so the aggregate must
  # never be skipped; it must be red. Nothing in this workflow uses continue-on-error.
  integrity:
    name: integrity
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    # The suites run in the shards. This job aggregates their receipts and then runs the downstream
    # gates, which took about 80 s of the serial job.
    timeout-minutes: 30

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        # No test needs git history: every suite that uses git builds its own repository in a temp
        # directory, and a depth-1 checkout was verified to produce identical results.
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Report environment
        run: |
          python --version
          python -c "import yaml; print('PyYAML', yaml.__version__)"
          git --version

      # Fails when a test file exists that no category claims, when a category names a file that is
      # gone, or when a suite is classified twice. Runs first so a classification mistake is
      # reported immediately rather than after five minutes of tests.
      - name: Verify the test manifest is closed-world
        run: python auxsays/scripts/ci/run_integrity_tests.py --check-manifest

      # Every shard artifact, one sub-directory each, into runner temporary storage. (When exactly one
      # artifact matches, download-artifact extracts it flat instead; the aggregator then refuses the
      # loose file and names the missing shards, so that case fails closed too.)
      - name: Download the shard receipts
        uses: actions/download-artifact@v8
        with:
          pattern: integrity-receipt-shard-*
          path: ${{ runner.temp }}/integrity-receipts

      # The only step that turns shard receipts into a verdict. It re-reads the manifest from THIS
      # checkout, recomputes the partition, and accepts only when the suites that passed are exactly
      # the governed population, each once, at its governed check count, on this commit, with every
      # shard job successful. A partial result is a rejection. See aggregate_integrity_receipts.py.
      - name: Aggregate the shard receipts
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          python auxsays/scripts/ci/aggregate_integrity_receipts.py \
            --receipts "$RUNNER_TEMP/integrity-receipts" --shards 4 \
            --needs-result "$SHARD_RESULT" --expected-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

      # Read-only data gates, proven not to write: a full-tree hash before/after all three is
      # unchanged. `qa_patch_records.py` used to be excluded here for exactly one reason -- it wrote
      # auxsays/_data/qa_status.json and had no read-only mode, and running a writer under a
      # git-diff guard that cannot see a gitignored file would be a false assurance. It now has
      # `--read-only`, which suppresses that single write statement and changes nothing else, so the
      # gate itself runs below against this tree. That matters more than tidiness: the gate is what
      # every writer lane and the Pages deploy block on, and a defect in it could previously only be
      # discovered by the scheduled run that it broke.
      #
      # The record-level invariants remain covered by test_qa_patch_records.py in the blocking
      # category, and the live-consensus precondition by test_consensus_live_gate.py.
      #
      # That last sentence was true of the RECORD-level predicates and false of the ones that read
      # the shipped layout, and the gap was not theoretical: AUX-030 changed aux-update.html, every
      # check here passed, the pull request merged, and the Pages build then failed its
      # publication-strict gate on a layout grep nothing at pull-request time could see. The suite
      # now calls scan_update_layout_public_copy() -- the gate's only template-reading function,
      # and a pure one -- against the real layout, so this workflow stays read-only AND the claim
      # above holds. Anything added to that gate which reads a template must be added there too.
      - name: Audit consensus evidence
        run: python auxsays/scripts/audit_consensus_evidence.py

      # The gate the writer lanes and the Pages deploy both block on, executed against this tree
      # rather than mirrored by a re-implementation. Publication mode is the stricter of the two and
      # is what pages.yml runs, so that is what is checked here.
      - name: Validate generated records (read-only)
        run: python auxsays/scripts/qa_patch_records.py --read-only --publish-strict

      - name: Validate ingestion sources
        run: python auxsays/scripts/validate_ingestion_sources.py

      - name: Validate evidence method health
        run: python auxsays/scripts/validate_evidence_method_health.py

      # A stored evidence row may not disappear, and may stop being accepted only by an audited
      # withdrawal: the row stays, with `counted: false` and a named `exclusion_reason`. (That is the
      # store's rows; editing a row's identity fields can still move a report between records -- see
      # lib/evidence_loss.py, WHAT THIS DOES NOT SEE.) The gates above cannot see a violation of
      # that, because each compares the records against the SAME store a purge rewrote -- a coherent
      # 98% DaVinci deletion passed all of them. The one reference a change cannot also rewrite is
      # the commit it replaces, so that is what this compares against.
      #
      # The base comes from the event, never from `main`: comparing against `main` silently becomes
      # comparing the change with itself the moment it merges (#68, #92). The checkout is depth 1,
      # so the base commit is fetched by sha -- anonymously, since the repository is public, and
      # into .git only, which the checkout-unmodified proof below does not see.
      #
      # This is the pull-request half. The automation writeback enforces the same predicate on
      # every scheduled lane, whose GITHUB_TOKEN pushes never trigger this workflow.
      - name: Refuse unexplained evidence loss
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE_SHA" ;;
            push)         BASE="$PUSH_BEFORE_SHA" ;;
            *)            BASE="" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # workflow_dispatch carries no base: judge the checked-out commit against its parent.
            git fetch --no-tags --quiet --depth=2 origin "$GITHUB_SHA"
            BASE="$(git rev-parse HEAD^1)"
          else
            git fetch --no-tags --quiet --depth=1 origin "$BASE"
          fi
          echo "evidence-loss base: $BASE ($EVENT_NAME)"
          python auxsays/scripts/check_evidence_loss.py --base "$BASE"

      # Belt and braces alongside the runner's own hash check: this also catches anything the QA
      # gates above might write to a TRACKED path.
      - name: Prove the checkout was not modified
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "::error::CI produced repository changes; it must be read-only"
            git status --porcelain --untracked-files=normal
            exit 1
          fi

      # The last word, independent of every script above. `always()` makes it run even when the run
      # was cancelled -- when every other step here is skipped -- so a cancelled or failed shard
      # always leaves this job red rather than green with nothing done.
      - name: Require every shard job to have succeeded
        if: always()
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "shard jobs: $SHARD_RESULT"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::a shard job concluded '$SHARD_RESULT'; the integrity run cannot pass"
            exit 1
          fi

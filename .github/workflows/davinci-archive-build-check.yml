name: DaVinci archive build check

# Pull-request validation only. It applies the DaVinci archive convergence to THIS runner's scratch
# checkout, then builds the site exactly as pages.yml does, and proves the archived notice renders on
# every archived DaVinci page and on no other page. Nothing is committed, pushed, deployed or
# dispatched: the job has read-only permissions and the converged tree is discarded with the runner.
#
# Every assertion is time-invariant. The first version asserted the one-time migration baseline (a
# fixed count of changed records and of notice pages, and one fixed active page), so once the
# migration ran in production the convergence changed nothing and the check failed on every pull
# request that triggered it. The rules now hold for zero changed records and for any later
# legitimate ratchet; they live in auxsays/scripts/ci/davinci_archive_check.py, where
# test_davinci_archive_check.py drives each one.
on:
  pull_request:
    paths:
      - 'auxsays/scripts/ci/davinci_archive_check.py'
      - 'auxsays/scripts/lib/davinci_archive_policy.py'
      - 'auxsays/scripts/apply_davinci_archive_policy.py'
      - 'auxsays/_includes/archived-notice.html'
      - 'auxsays/_layouts/aux-update.html'
      - '.github/workflows/patch-ingest.yml'
      - '.github/workflows/davinci-archive-build-check.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: davinci-archive-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this is the scratch tree)
        uses: actions/checkout@v7

      # Same Ruby, same Gemfile location and same tracked lock as pages.yml.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: auxsays/Gemfile
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node for Systems Monitor
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source health dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Install image metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Verify the dependency lock was used, not rewritten
        working-directory: ./auxsays
        env:
          BUNDLE_GEMFILE: Gemfile
        run: |
          set -euo pipefail
          test -f Gemfile.lock || { echo "::error::Gemfile.lock is missing."; exit 1; }
          bundle config set --local frozen true
          bundle check
          if ! git diff --quiet -- Gemfile.lock; then
            echo "::error::Gemfile.lock changed during installation."
            git --no-pager diff -- Gemfile.lock
            exit 1
          fi
          bundle list | sed -n '1,12p'

      # The converged tree exists only on this runner. Nothing below writes it back anywhere.
      # Before convergence: the archive plan must not be refused, and the tracked tree must equal the
      # commit, so every later change is attributable to the convergence. The plan is kept in runner
      # temporary storage, outside the checkout.
      - name: Validate the archive plan before convergence
        run: |
          set -euo pipefail
          python auxsays/scripts/ci/davinci_archive_check.py preplan --out "$RUNNER_TEMP/davinci-archive-preplan.json"

      - name: Apply the archive convergence to the scratch tree
        run: |
          set -euo pipefail
          python auxsays/scripts/apply_davinci_archive_policy.py --write --confirm-write

      # Any number of transitions, including none. Judged per FILE against the commit, with rename
      # detection off: each changed file must be an existing DaVinci record (read from the commit's own
      # front matter, since other products share the directory) that the plan held, changed by exactly
      # one front-matter line from current to archived. An added, deleted or renamed record, an
      # unarchive, any other edit and any file outside the generated records fail by name. The plan
      # is then taken again and must be accepted with nothing pending.
      - name: Assert the convergence made only planned current-to-archived edits and left nothing pending
        run: |
          set -euo pipefail
          python auxsays/scripts/ci/davinci_archive_check.py convergence --plan "$RUNNER_TEMP/davinci-archive-preplan.json"

      # The next steps are copied from pages.yml, in the same order, up to and including the build.
      - name: Strip image metadata
        working-directory: ./auxsays
        run: bash scripts/strip_image_metadata.sh assets/img

      - name: Generate source health snapshot
        run: python auxsays/scripts/source_health_snapshot.py

      - name: Generate public monitoring projection
        run: python auxsays/scripts/build_monitoring_projection.py

      - name: Build the live-consensus eligibility projection
        run: python auxsays/scripts/build_live_eligibility_projection.py

      - name: Validate logo assets
        run: python auxsays/scripts/validate_logo_assets.py

      - name: Run generated record QA (publication-strict)
        run: python auxsays/scripts/qa_patch_records.py --publish-strict

      - name: Install Systems Monitor dependencies
        run: npm ci --prefix systems-monitor/app

      - name: Validate and build Systems Monitor
        run: npm run validate --prefix systems-monitor/app

      - name: Build site
        working-directory: ./auxsays
        run: bundle exec jekyll build --trace

      - name: Verify Systems Monitor static integration
        run: npm run verify:site --prefix systems-monitor/app

      # Exhaustive, not a count: every DaVinci record's page, resolved from its permalink, exists and
      # carries the notice exactly once if the record is archived and not at all otherwise; no other
      # page carries it; the archived population is at least the ratchet floor and at least one record
      # is active. 19.1.4 is the fixed archived spot page (the ratchet keeps it archived for good);
      # the active spot page is chosen from the converged tree, so it moves when a new major ships.
      - name: Assert every DaVinci page shows the archived notice exactly when its record is archived
        run: |
          set -euo pipefail
          python auxsays/scripts/ci/davinci_archive_check.py render --site auxsays/_site

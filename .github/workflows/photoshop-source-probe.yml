name: Photoshop Source Probe

# TEMPORARY, MANUAL-ONLY. Answers one question that cannot be answered from a workstation: does an
# official Adobe Photoshop release-history endpoint respond from GitHub Actions egress?
#
# `patch_ingestion_sources.yml` keeps adobe-photoshop disabled on the recorded grounds that the
# canonical HelpX page "is not reachable from datacenter / GitHub Actions egress (connection times
# out, zero bytes)". Local measurement now shows a fast 403 rather than a timeout, and shows the
# host serving 67,998 bytes to a cold client before rate-limiting a burst -- so the recorded
# blocker needs re-measuring from the egress that actually matters.
#
# No write permissions, no token use, no repository mutation. It prints measurements.

# Push-triggered on this sprint branch only: workflow_dispatch needs the file on the default
# branch, and putting a throwaway probe there to measure one thing is the wrong trade.
on:
  push:
    branches:
      - sprint/photoshop-ingestion

permissions:
  contents: read

concurrency:
  group: photoshop-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Egress identity
        run: |
          echo "runner public IP:"
          curl -sS --max-time 10 https://api.ipify.org || echo "(ipify unavailable)"
          echo

      - name: Probe official Adobe endpoints
        run: |
          python auxsays/scripts/probe_photoshop_sources.py \
            --gap 8 \
            --json probe-result.json

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photoshop-source-probe
          path: probe-result.json
          if-no-files-found: warn

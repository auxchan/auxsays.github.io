name: Patch Evidence Collection

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: "Optional product_id: obs-studio, blackmagic-davinci, adobe-premiere-pro, adobe-acrobat-reader, adobe-acrobat-pro, microsoft-windows-11, or microsoft-powerpoint (dry_run only)"
        required: false
        type: string
      dry_run:
        description: "Fetch and report without writing evidence or records"
        required: false
        default: false
        type: boolean
  schedule:
    # Temporary bounded-recovery cadence: every 6 hours (was 4h). A run can take up to the 300-min
    # job timeout; a 6h (360-min) interval leaves 60 min after the job bound before the next slot is
    # due -- no overlap and no accumulating queue (reinforced by the concurrency group below).
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: auxsays-main-writeback
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Finite job timeout that bounds a true runaway WITHOUT cutting off the normal workload. The
    # first post-fix natural run (30743094087) hit the prior 180-min collection-step cap, so the
    # collection step is raised to 240 min (below); the job is raised to 300 min to leave 60 min
    # after the collection cap for QA, audit, EMH validation, transactional commit, push, explicit
    # Pages dispatch, and the final summary. 300 min stays under the GitHub 6h default and, with the
    # every-6-hours (360-min) cadence below, leaves 60 min before the next slot -- no overlap/queue.
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Resolve the ref when Checkout actually runs -- after this job has waited out the shared
          # auxsays-main-writeback concurrency queue -- instead of the trigger-time SHA the default
          # pins. Cron drift decides which lane queues, so this lane needs the same fresh base as
          # patch-ingest: whichever job runs second must build on the winner's writeback. github.ref
          # (not a literal branch) keeps workflow_dispatch against another branch or tag working.
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Collect patch evidence
        id: collect
        # Finite step timeout below the job timeout. Raised 180 -> 240 min: with the collector-txn
        # git-root fix (PR #38) the OBS + Acrobat collectors now complete their writeback instead of
        # rolling back, so the workload grew past the prior 180-min cap. 240 min leaves 60 min under
        # the 300-min job cap for the downstream validation/writeback/deploy steps. It still trips on
        # a genuine per-step hang; this sprint does not address collector inefficiency itself.
        timeout-minutes: 240
        env:
          AUXSAYS_ENABLE_WINDOWS_LEARN_QNA_WRITEBACK: "true"
          # Acrobat consensus is activated: its keyless inSided/Algolia discovery method is
          # reachable from GitHub Actions (unlike the CloudFront-blocked /t5 search, Reddit,
          # and the dead Brave key), proven by dry-run on the PR branch. See PR #23.
          AUXSAYS_ENABLE_ACROBAT_CONSENSUS: "true"
          # PowerPoint community evidence: ACTIVE in the scheduled path. Canonical identity is the
          # triple (product_id, update_version, target_build), and counted evidence REQUIRES the
          # report to name the exact Current Channel build -- a version-only report is refused with
          # missing_exact_build rather than attributed by inference. Promotion is scoped to this
          # product and its generated records have their own writeback --allow, so evidence, method
          # health and the record mutation commit together or not at all.
          AUXSAYS_ENABLE_POWERPOINT_CONSENSUS: "true"
          # NO DOUBLE COLLECTION. PowerPoint is driven by the repo-owned orchestration graph in the
          # dedicated job below, so it is REMOVED from this runner's collector registry. The
          # exclusion is enforced inside build_collectors(), not by this step's arguments, so the
          # legacy path cannot collect PowerPoint even under an explicit --product-id.
          AUXSAYS_ORCHESTRATED_PRODUCTS: "microsoft-powerpoint"
        run: |
          args=(--since-days 45 --max-pages 5)

          raw_product_id="${{ github.event.inputs.product_id }}"
          product_id="$(printf '%s' "$raw_product_id" | tr -d '\r' | sed -E 's/^[[:space:]]*product_id:[[:space:]]*//' | xargs)"

          case "$product_id" in
            ""|obs-studio|blackmagic-davinci|adobe-premiere-pro|adobe-acrobat-reader|adobe-acrobat-pro|microsoft-windows-11|microsoft-powerpoint) ;;
            *)
              echo "::error::Invalid product_id '$product_id'. Use obs-studio, blackmagic-davinci, adobe-premiere-pro, adobe-acrobat-reader, adobe-acrobat-pro, microsoft-windows-11, or microsoft-powerpoint."
              exit 2
              ;;
          esac

          # PowerPoint is no longer dry_run-only: build-aware identity, scoped promotion and a
          # material writeback --allow are all in place, and counted evidence requires the exact
          # build, so a --write run targeting it is now a normal production run.

          if [ "$product_id" != "" ]; then
            args+=(--product-id "$product_id")
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--write)
          fi

          python auxsays/scripts/run_patch_evidence_collection.py "${args[@]}"

      - name: Build consensus status
        id: consensus
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/build_consensus_from_evidence.py

      - name: Promote Acrobat consensus to its counted population
        # Acrobat Pro and Reader had NO scoped promotion anywhere. Their projections were rebuilt
        # only by the UNSCOPED --write-all in davinci-updates.yml -- the same call that overwrote
        # Premiere's hand-authored prose -- so scoping that lane (PR #76) would have left 83
        # positive-count Acrobat records with no rebuild path at all, re-opening for Acrobat exactly
        # the STALE_EXHAUSTIVE_PROJECTION class #75 closed for OBS. Reproduced: add one counted
        # Acrobat row and the scoped lane leaves `report_count_source_list_mismatch` standing that
        # the unscoped lane cleared.
        #
        # Two invocations because --product-id takes ONE value and Pro/Reader are distinct
        # product_ids that are never merged. BOTH are now in CONSENSUS_PROMOTION_PRODUCTS, i.e.
        # retraction-eligible -- granted precisely BECAUSE these steps exist, since `--write-all`
        # skips zero-count groups and without retraction no lane could produce the zero shape. The
        # test invariant stays `retractable SUBSET OF promoted` rather than equality, so these two
        # invocations are what makes that membership legal: delete either one and R7 fails.
        #
        # adobe-premiere-pro is deliberately absent and must stay absent: its record carries 6 hand
        # commits and `_record_coherence_fields` has a premiere branch, so promoting it would replace
        # human decision prose with generated text. That is the defect PR #76 exists to stop.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id adobe-acrobat-pro \
            --write-all --confirm-write
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id adobe-acrobat-reader \
            --write-all --confirm-write

      - name: Promote OBS consensus to its counted population
        # OBS records were the last consensus product whose PROJECTIONS nothing in this lane
        # refreshed. Reconciliation writes the count and nothing else, so 2026-08-14-obs-studio-32-2-2
        # published `update_report_count: 7` beside `accepted_report_sources` holding only the FIRST
        # THREE of those seven issues (13803/13806/13807), `evidence_samples` stuck at 3 where the
        # cap is 5, and -- worst -- `quick_verdict` reading "TEST FIRST: OBS Studio 32.2.2 has 3 user
        # reports found." A reader saw 7 and 3 on one page. Historically OBS coherence was restored
        # only by the UNSCOPED --write-all in davinci-updates.yml, which is workflow_dispatch-only,
        # so any record accumulating rows after the last manual run drifted until someone noticed.
        #
        # Scoped to --product-id, and positioned with the other promotions between reconciliation and
        # the first QA -- see the PowerPoint step for why that gap must contain no validation.
        # obs-studio DOES have a branch in _record_coherence_fields, and that is required here rather
        # than avoided: its `quick_verdict` states the report count, so it is count-derived and stale
        # too. All 51 commits on that record are automated (zero human), unlike premiere 26.2 which
        # carries 6 hand commits and is not in scope for any promotion step.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id obs-studio \
            --write-all --confirm-write

      - name: Promote PowerPoint consensus to build-aware records
        # Scoped to microsoft-powerpoint via --product-id: no other product's promotion behaviour
        # changes. The engine is the existing generic one; identity is the canonical triple
        # (product_id, update_version, target_build), so evidence for one Current Channel build
        # can only ever reconcile onto that build's own record. No-ops when PowerPoint has no
        # evidence.
        #
        # POSITION IS LOAD-BEARING, and this step used to sit after QA/audit. Reconciliation moves
        # the count and retracts projections for every retractable product; only that product's own
        # promotion rebuilds them. With QA in between, the first run after a PowerPoint population
        # emptied and refilled died on report_count_without_consensus_summary before this step ran,
        # taking the whole writeback with it -- so a cycle of OBS, DaVinci, Acrobat and Premiere
        # evidence was never committed either. Reproduced. Every retractable product's promotion now
        # sit between reconciliation and the first QA, and a test asserts that for every product in
        # lib.report_counts.CONSENSUS_PROMOTION_PRODUCTS rather than for one product by name.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id microsoft-powerpoint \
            --write-all --confirm-write

      - name: Promote Windows consensus to its current patch identity
        # Windows records are the one place the count and its prose could disagree: a Windows record
        # tracks ONE cumulative update (KB / OS build) inside a feature train that rolls over
        # monthly, and reconcile_record_counts fixes only the NUMBER. Before this step existed the
        # 25H2 record published `update_report_count: 32` beside prose reading "9 user reports",
        # because the number advanced with each rollover while nothing regenerated the sentence.
        # Scoped to --product-id: no other product's records are touched, and every count-derived
        # field here is regenerated from the same canonical population the count comes from --
        # while that population is NON-EMPTY. This step skips a group at count <= 0, so the empty
        # case (every KB rollover) is retracted by reconcile_record_counts instead; see
        # lib.report_counts.retract_zero_count_projections.
        #
        # POSITION IS LOAD-BEARING: this runs immediately after reconciliation and BEFORE QA.
        # Reconciliation moves the NUMBER and retracts projections; this step is the only thing that
        # rebuilds them. With QA in between, the first run after a rollover -- count back above zero,
        # projections not yet regenerated -- failed `report_count_without_consensus_summary` and
        # `report_count_without_evidence_samples`, so the job died before reaching this step, the
        # projections were never rebuilt, and every later run repeated it. Verified: a permanent
        # wedge. QA must validate the state the writers finished, not one halfway through.
        #
        # Windows has no branch in _record_coherence_fields, so this cannot rewrite verdict prose --
        # pinned by test, not just asserted here. All 361 commits across the two records are automated.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id microsoft-windows-11 \
            --write-all --confirm-write

      - name: QA patch records
        id: qa
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/qa_patch_records.py

      - name: Audit consensus evidence
        id: audit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/audit_consensus_evidence.py

      - name: Re-run QA after consensus promotion
        # Promotion mutates report counts; re-validate before anything is staged so a
        # half-promoted tree cannot reach the writeback.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/qa_patch_records.py

      - name: Remove transient validation output
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          rm -rf auxsays/_site node_modules .jekyll-cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f auxsays/_data/qa_status.json
          rm -f auxsays/_data/consensus_status.json
          # source_health.yml and patch_ingest_state.json are TRACKED and are in no --allow entry
          # for this lane, so `rm -f` left an unstaged tracked DELETION: material the writeback
          # validators could observe while the commit omitted it (audit_consensus_evidence.py
          # reads patch_ingest_state.json for source-freshness state). Restore the committed
          # content instead -- the tree the validators read is then exactly the tree that gets
          # committed, which is what automation_writeback now enforces fail-closed.
          git checkout -- auxsays/_data/source_health.yml auxsays/_data/patch_ingest_state.json

      - name: Commit material evidence changes (conflict-safe writeback)
        id: writeback
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python auxsays/scripts/lib/automation_writeback.py \
            --message "Update automated patch evidence" \
            --allow auxsays/_data/consensus_evidence.yml \
            --allow auxsays/_data/evidence_method_health.yml \
            --allow auxsays/_data/update_linked_evidence.yml \
            --allow 'auxsays/updates/generated/*obs-studio*.md' \
            --allow 'auxsays/updates/generated/*davinci*.md' \
            --allow 'auxsays/updates/generated/*premiere-pro*.md' \
            --allow 'auxsays/updates/generated/*windows-11*.md' \
            --allow 'auxsays/updates/generated/*acrobat*.md' \
            --allow 'auxsays/updates/generated/*powerpoint*.md' \
            --validate 'python auxsays/scripts/qa_patch_records.py' \
            --validate 'python auxsays/scripts/audit_consensus_evidence.py' \
            --validate 'python auxsays/scripts/validate_evidence_method_health.py' \
            --validate-before-commit \
            --max-retries 5 \
            --pages-cmd 'gh workflow run pages.yml --ref main' \
            --pages-max-attempts 3 --pages-backoff 5,15 \
            --deploy-recovery \
            --recovery-site-path 'auxsays/updates/generated/*' \
            --recovery-site-path auxsays/_data/consensus_evidence.yml \
            --recovery-site-path auxsays/_data/evidence_method_health.yml

      - name: Run summary (pipeline stages)
        # always() so it reports even when an earlier step failed (e.g. a collect-step timeout,
        # which trips the 180-min STEP cap first -> this still runs, unlike a job-level timeout).
        # Reports the downstream stages the collect-step summary can't see: whether collection
        # reached validation, whether writeback occurred, and whether Pages dispatch occurred.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          COLLECT: ${{ steps.collect.outcome }}
          CONSENSUS: ${{ steps.consensus.outcome }}
          QA: ${{ steps.qa.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          WRITEBACK: ${{ steps.writeback.outcome }}
          WB_CHANGED: ${{ steps.writeback.outputs.changed }}
          WB_DEPLOY: ${{ steps.writeback.outputs.deploy_changed }}
          WB_PUSHED: ${{ steps.writeback.outputs.pushed }}
          WB_PENDING: ${{ steps.writeback.outputs.deployment_pending }}
          WB_OUTCOME: ${{ steps.writeback.outputs.outcome }}
        run: |
          if [ "$QA" = success ] && [ "$AUDIT" = success ]; then validation="yes"; else validation="no (qa=$QA, audit=$AUDIT)"; fi
          if [ "$WRITEBACK" != success ]; then
            writeback="no (writeback step: ${WRITEBACK:-did-not-run})"
            pages="n/a (writeback step: ${WRITEBACK:-did-not-run})"
          else
            if [ "$WB_PUSHED" = true ]; then writeback="yes (pushed; changed=${WB_CHANGED})"; else writeback="no material change"; fi
            if [ "$WB_DEPLOY" = true ] && [ "$WB_PENDING" = true ]; then pages="attempted, FAILED (deployment_pending)"
            elif [ "$WB_DEPLOY" = true ]; then pages="dispatched"
            else pages="not needed (no site-path change)"; fi
          fi
          {
            echo "### 🔎 Pipeline stage summary"
            echo ""
            echo "- collect step: **${COLLECT}**"
            echo "- build consensus: **${CONSENSUS:-skipped}**"
            echo "- reached validation (QA + audit succeeded): **${validation}**"
            echo "- writeback occurred: **${writeback}**"
            echo "- Pages dispatch: **${pages}**"
            echo "- writeback outcome token: \`${WB_OUTCOME:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  powerpoint-orchestrated:
    # The PowerPoint lane, driven by the repo-owned deterministic orchestration graph. This is the
    # ONLY path that collects PowerPoint: the legacy runner above refuses to register it (see
    # AUXSAYS_ORCHESTRATED_PRODUCTS), so no product is ever collected twice in one run.
    #
    # `needs: collect` serialises the two lanes. The workflow-level concurrency group only
    # serialises RUNS, not jobs within a run, and both lanes commit to main -- running them in
    # parallel would race two writebacks against the same branch. Sequencing costs a few minutes
    # and removes the race entirely.
    #
    # The graph invokes the SAME authorities the lane above uses -- the PowerPoint collector's own
    # method functions, the evidence/health appenders, reconcile_record_counts,
    # apply_consensus_to_records, qa_patch_records, audit_consensus_evidence and
    # lib.automation_writeback. It re-implements none of them, and requires no AI.
    needs: collect
    if: ${{ always() && needs.collect.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fresh base AFTER the collect lane's writeback landed, so this lane rebases onto it
          # rather than racing it.
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Run the PowerPoint evidence graph
        id: graph
        env:
          # Checkpoints live OUTSIDE the repo tree; the checkpointer refuses an in-repo directory
          # that is not git-ignored, so a checkpoint can never be swept into a commit.
          AUXSAYS_CHECKPOINT_DIR: ${{ runner.temp }}/auxsays-orchestration
        run: |
          mode=(--write)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then mode=(); fi

          python auxsays/scripts/orchestrate_evidence_run.py \
            --product-id microsoft-powerpoint \
            --checkpoint-dir "$AUXSAYS_CHECKPOINT_DIR" \
            --message "Update automated patch evidence (PowerPoint)" \
            --since-days 45 --max-pages 5 \
            "${mode[@]}" | tee "$RUNNER_TEMP/graph-summary.json"

      - name: Graph summary
        if: ${{ always() }}
        env:
          GRAPH: ${{ steps.graph.outcome }}
        run: |
          summary="$RUNNER_TEMP/graph-summary.json"
          {
            echo "### 🕸️ PowerPoint orchestration graph"
            echo ""
            echo "- graph step: **${GRAPH}**"
            if [ -s "$summary" ]; then
              echo "- terminal: **$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('terminal','?'))" "$summary" 2>/dev/null || echo '?')**"
              echo ""
              echo '<details><summary>run summary</summary>'
              echo ""
              echo '```json'
              cat "$summary"
              echo '```'
              echo ""
              echo '</details>'
            else
              echo "- no run summary was produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

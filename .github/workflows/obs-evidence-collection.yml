name: Patch Evidence Collection

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: "Optional product_id: obs-studio, blackmagic-davinci, adobe-premiere-pro, adobe-acrobat-reader, adobe-acrobat-pro, microsoft-windows-11, or microsoft-powerpoint (dry_run only)"
        required: false
        type: string
      dry_run:
        description: "Fetch and report without writing evidence or records"
        required: false
        default: false
        type: boolean
  schedule:
    # Temporary bounded-recovery cadence: every 6 hours (was 4h). A run can take up to the 300-min
    # job timeout; a 6h (360-min) interval leaves 60 min after the job bound before the next slot is
    # due -- no overlap and no accumulating queue (reinforced by the concurrency group below).
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: auxsays-main-writeback
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Finite job timeout that bounds a true runaway WITHOUT cutting off the normal workload. The
    # first post-fix natural run (30743094087) hit the prior 180-min collection-step cap, so the
    # collection step is raised to 240 min (below); the job is raised to 300 min to leave 60 min
    # after the collection cap for QA, audit, EMH validation, transactional commit, push, explicit
    # Pages dispatch, and the final summary. 300 min stays under the GitHub 6h default and, with the
    # every-6-hours (360-min) cadence below, leaves 60 min before the next slot -- no overlap/queue.
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Resolve the ref when Checkout actually runs -- after this job has waited out the shared
          # auxsays-main-writeback concurrency queue -- instead of the trigger-time SHA the default
          # pins. Cron drift decides which lane queues, so this lane needs the same fresh base as
          # patch-ingest: whichever job runs second must build on the winner's writeback. github.ref
          # (not a literal branch) keeps workflow_dispatch against another branch or tag working.
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r auxsays/scripts/requirements-ingest.txt

      - name: Collect patch evidence
        id: collect
        # Finite step timeout below the job timeout. Raised 180 -> 240 min: with the collector-txn
        # git-root fix (PR #38) the OBS + Acrobat collectors now complete their writeback instead of
        # rolling back, so the workload grew past the prior 180-min cap. 240 min leaves 60 min under
        # the 300-min job cap for the downstream validation/writeback/deploy steps. It still trips on
        # a genuine per-step hang; this sprint does not address collector inefficiency itself.
        timeout-minutes: 240
        env:
          AUXSAYS_ENABLE_WINDOWS_LEARN_QNA_WRITEBACK: "true"
          # Acrobat consensus is activated: its keyless inSided/Algolia discovery method is
          # reachable from GitHub Actions (unlike the CloudFront-blocked /t5 search, Reddit,
          # and the dead Brave key), proven by dry-run on the PR branch. See PR #23.
          AUXSAYS_ENABLE_ACROBAT_CONSENSUS: "true"
          # PowerPoint community-evidence PILOT: registered ONLY for a manual dry_run dispatch,
          # never for a scheduled or --write run. This lets a maintainer observe the collector
          # from GitHub Actions (read-only) without activating scheduled production consensus.
          AUXSAYS_ENABLE_POWERPOINT_CONSENSUS: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        run: |
          args=(--since-days 45 --max-pages 5)

          raw_product_id="${{ github.event.inputs.product_id }}"
          product_id="$(printf '%s' "$raw_product_id" | tr -d '\r' | sed -E 's/^[[:space:]]*product_id:[[:space:]]*//' | xargs)"

          case "$product_id" in
            ""|obs-studio|blackmagic-davinci|adobe-premiere-pro|adobe-acrobat-reader|adobe-acrobat-pro|microsoft-windows-11|microsoft-powerpoint) ;;
            *)
              echo "::error::Invalid product_id '$product_id'. Use obs-studio, blackmagic-davinci, adobe-premiere-pro, adobe-acrobat-reader, adobe-acrobat-pro, microsoft-windows-11, or microsoft-powerpoint."
              exit 2
              ;;
          esac

          # PowerPoint is a dry_run-only pilot: refuse a --write run targeting it (belt-and-suspenders;
          # the enable flag is already gated to dry_run, so it would not be registered anyway).
          if [ "$product_id" = "microsoft-powerpoint" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "::error::microsoft-powerpoint is a dry_run-only pilot; re-run with dry_run=true."
            exit 2
          fi

          if [ "$product_id" != "" ]; then
            args+=(--product-id "$product_id")
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--write)
          fi

          python auxsays/scripts/run_patch_evidence_collection.py "${args[@]}"

      - name: Build consensus status
        id: consensus
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/build_consensus_from_evidence.py

      - name: QA patch records
        id: qa
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/qa_patch_records.py

      - name: Audit consensus evidence
        id: audit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/audit_consensus_evidence.py

      - name: Promote PowerPoint consensus to build-aware records
        # Scoped to microsoft-powerpoint via --product-id: no other product's promotion behaviour
        # changes. The engine is the existing generic one; identity is the canonical triple
        # (product_id, update_version, target_build), so evidence for one Current Channel build
        # can only ever reconcile onto that build's own record. Runs after QA/audit so it never
        # promotes onto a tree those gates rejected. No-ops when PowerPoint has no evidence.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python auxsays/scripts/apply_consensus_to_records.py \
            --product-id microsoft-powerpoint \
            --write-all --confirm-write

      - name: Re-run QA after PowerPoint promotion
        # Promotion mutates report counts; re-validate before anything is staged so a
        # half-promoted tree cannot reach the writeback.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python auxsays/scripts/qa_patch_records.py

      - name: Remove transient validation output
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          rm -rf auxsays/_site node_modules .jekyll-cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f auxsays/_data/qa_status.json
          rm -f auxsays/_data/consensus_status.json
          # source_health.yml and patch_ingest_state.json are TRACKED and are in no --allow entry
          # for this lane, so `rm -f` left an unstaged tracked DELETION: material the writeback
          # validators could observe while the commit omitted it (audit_consensus_evidence.py
          # reads patch_ingest_state.json for source-freshness state). Restore the committed
          # content instead -- the tree the validators read is then exactly the tree that gets
          # committed, which is what automation_writeback now enforces fail-closed.
          git checkout -- auxsays/_data/source_health.yml auxsays/_data/patch_ingest_state.json

      - name: Commit material evidence changes (conflict-safe writeback)
        id: writeback
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python auxsays/scripts/lib/automation_writeback.py \
            --message "Update automated patch evidence" \
            --allow auxsays/_data/consensus_evidence.yml \
            --allow auxsays/_data/evidence_method_health.yml \
            --allow 'auxsays/updates/generated/*obs-studio*.md' \
            --allow 'auxsays/updates/generated/*davinci*.md' \
            --allow 'auxsays/updates/generated/*premiere-pro*.md' \
            --allow 'auxsays/updates/generated/*windows-11*.md' \
            --allow 'auxsays/updates/generated/*acrobat*.md' \
            --allow 'auxsays/updates/generated/*powerpoint*.md' \
            --validate 'python auxsays/scripts/qa_patch_records.py' \
            --validate 'python auxsays/scripts/audit_consensus_evidence.py' \
            --validate 'python auxsays/scripts/validate_evidence_method_health.py' \
            --validate-before-commit \
            --max-retries 5 \
            --pages-cmd 'gh workflow run pages.yml --ref main' \
            --pages-max-attempts 3 --pages-backoff 5,15 \
            --deploy-recovery \
            --recovery-site-path 'auxsays/updates/generated/*' \
            --recovery-site-path auxsays/_data/consensus_evidence.yml \
            --recovery-site-path auxsays/_data/evidence_method_health.yml

      - name: Run summary (pipeline stages)
        # always() so it reports even when an earlier step failed (e.g. a collect-step timeout,
        # which trips the 180-min STEP cap first -> this still runs, unlike a job-level timeout).
        # Reports the downstream stages the collect-step summary can't see: whether collection
        # reached validation, whether writeback occurred, and whether Pages dispatch occurred.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          COLLECT: ${{ steps.collect.outcome }}
          CONSENSUS: ${{ steps.consensus.outcome }}
          QA: ${{ steps.qa.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          WRITEBACK: ${{ steps.writeback.outcome }}
          WB_CHANGED: ${{ steps.writeback.outputs.changed }}
          WB_DEPLOY: ${{ steps.writeback.outputs.deploy_changed }}
          WB_PUSHED: ${{ steps.writeback.outputs.pushed }}
          WB_PENDING: ${{ steps.writeback.outputs.deployment_pending }}
          WB_OUTCOME: ${{ steps.writeback.outputs.outcome }}
        run: |
          if [ "$QA" = success ] && [ "$AUDIT" = success ]; then validation="yes"; else validation="no (qa=$QA, audit=$AUDIT)"; fi
          if [ "$WRITEBACK" != success ]; then
            writeback="no (writeback step: ${WRITEBACK:-did-not-run})"
            pages="n/a (writeback step: ${WRITEBACK:-did-not-run})"
          else
            if [ "$WB_PUSHED" = true ]; then writeback="yes (pushed; changed=${WB_CHANGED})"; else writeback="no material change"; fi
            if [ "$WB_DEPLOY" = true ] && [ "$WB_PENDING" = true ]; then pages="attempted, FAILED (deployment_pending)"
            elif [ "$WB_DEPLOY" = true ]; then pages="dispatched"
            else pages="not needed (no site-path change)"; fi
          fi
          {
            echo "### 🔎 Pipeline stage summary"
            echo ""
            echo "- collect step: **${COLLECT}**"
            echo "- build consensus: **${CONSENSUS:-skipped}**"
            echo "- reached validation (QA + audit succeeded): **${validation}**"
            echo "- writeback occurred: **${writeback}**"
            echo "- Pages dispatch: **${pages}**"
            echo "- writeback outcome token: \`${WB_OUTCOME:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"
